# SPDX-License-Identifier: MIT

# Release workflow.
#
# Trigger: a tag of the form `vMAJOR.MINOR.PATCH` is pushed to the repository.
#
# The workflow orchestrates four release artifact classes in dependency order
# (CI itself runs earlier, on the push / pull request that landed the release
# commit — this workflow assumes those gates are already green):
#
#   (1) Build      — sdist + wheel via PEP 517 build, then a CycloneDX SBOM
#                    of what those distributions ship (vendored packages
#                    included), written beside them in dist/.
#   (2) Sign       — Sigstore cosign keyless signature on every dist/ file,
#                    the SBOM included.
#   (3) Provenance — SLSA Level 3 provenance via the slsa-framework reusable
#                    workflow; its subjects are every dist/ file, the SBOM
#                    included.
#
# Once those finish, the workflow:
#
#   - Publishes a GitHub Release that mirrors the matching CHANGELOG section.
#   - Attaches every release artifact (sdist + wheel + SBOM + one
#     <asset>.cosign.bundle per signed asset + provenance + platform runtime
#     archives + SHA256SUMS) to the Release page.
#
# Users verify with the exact certificate identity
#   https://github.com/Ahmed-G-Gad/apothem/.github/workflows/release.yml@refs/tags/<tag>
# (owner casing as GitHub reports it); scripts/release/verify-provenance.sh
# runs every check.
#
# All single-org actions are pinned by 40-character commit SHA followed by a
# `# vMAJOR.MINOR.PATCH` version comment. The SLSA generator is referenced by
# its trusted reusable-workflow tag (Sigstore's policy requires per-tag trust
# anchors and forbids SHA-pinning of trusted reusable workflows); this
# exception is annotated inline with the `action-pinning-exempt:` marker on
# the `uses:` line that consumes the reusable workflow.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          # Full history and tags: the plugin-version check below compares
          # this tag with the previous release tag.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Check the plugin version changed with the plugin
        # Claude Code keeps users on a cached plugin until its manifest
        # version changes, so a release whose plugin differs from the previous
        # tag under the same version strands every earlier install.
        run: python scripts/release/check_plugin_version_bump.py
      - name: Install build toolchain
        run: python -m pip install --require-hashes -r scripts/release/requirements-build-linux.txt
      - name: Build sdist + wheel
        run: |
          set -euo pipefail
          # Reproducible builds: pin every archive mtime to the release
          # commit's timestamp so identical sources produce byte-identical
          # artifacts (verifiable against the SLSA provenance).
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH ($(date -u -d "@$SOURCE_DATE_EPOCH" '+%Y-%m-%dT%H:%M:%SZ'))"
          # --no-isolation builds with the hash-locked toolchain installed
          # above; an isolated build fetches build-system.requires from PyPI
          # unhashed. pyproject.toml pins the same setuptools.
          python -m build --no-isolation
          # The wheel honours SOURCE_DATE_EPOCH; the sdist's gzip header and
          # tar entries carry build-time and checkout metadata. Normalize them.
          python scripts/release/normalize_sdist.py dist/*.tar.gz
      - name: Generate SBOM from the built distributions
        # The SBOM describes what ships: the wheel's metadata and declared
        # requirements, every package vendored under apothem/_vendor (pinned
        # in vendor.txt and checked against the wheel), and the SHA-256 of
        # each distribution. A scan of the checkout instead listed the docs
        # site and the build toolchain and missed every vendored package.
        # Written into dist/ so it is hashed into the provenance and signed.
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          python scripts/release/generate_sbom.py --dist dist --output dist/sbom.cdx.json
      - name: Compute artifact hashes
        id: hash
        run: |
          set -euo pipefail
          hashes=$(sha256sum dist/* | base64 -w0)
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"
      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  sign:
    name: sign artifacts (cosign keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    permissions:
      contents: read
      id-token: write   # OIDC for Sigstore keyless signing
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        with:
          # The cosign v2 -> v3 major is an operator decision; pin the
          # binary explicitly so an installer bump never moves it implicitly.
          cosign-release: 'v2.6.3'
      - name: Sign each artifact (keyless)
        run: |
          set -euo pipefail
          for f in dist/*; do
            cosign sign-blob --yes \
              --bundle "${f}.cosign.bundle" \
              "${f}"
          done
      - name: Upload cosign bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cosign-bundles
          path: dist/*.cosign.bundle
          retention-days: 90

  provenance:
    name: SLSA-3 provenance
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    # SLSA reusable workflows are trust-anchored on the per-tag attestation
    # surface; SHA-pinning is forbidden by the SLSA policy. This is the sole
    # exception to the SHA-pinning rule and is documented in the audit doc.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0  # action-pinning-exempt: SLSA reusable workflow trust-anchored on per-tag attestation per Sigstore policy
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      provenance-name: provenance.intoto.jsonl
      upload-assets: false
      private-repository: false

  attest:
    name: GitHub build-provenance attestation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    # Complements the SLSA generator with a GitHub-native attestation: the SLSA
    # provenance is a portable in-toto document attached to the Release, while
    # attest-build-provenance records the same subjects to GitHub's attestation
    # store (verifiable with `gh attestation verify`). id-token + attestations
    # are scoped to this job only.
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: dist/*

  verify-provenance:
    name: verify SLSA provenance artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [provenance]
    permissions:
      actions: read
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Download SLSA provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: provenance.intoto.jsonl
          path: provenance/
      - name: Validate SLSA provenance artifact
        run: |
          set -euo pipefail
          test -s provenance/provenance.intoto.jsonl
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("provenance/provenance.intoto.jsonl")
          lines = [line for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          if not lines:
              raise SystemExit("empty provenance artifact")
          for line in lines:
              payload = json.loads(line)
              if not isinstance(payload, dict):
                  raise SystemExit("provenance line is not a JSON object")
          PY

  archive-build:
    name: build platform archive (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [build]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    steps:
      - name: Harden runner
        # harden-runner supports only Ubuntu runners; guard it so the step is
        # skipped on the macos-latest / windows-latest cells and the "Harden
        # runner" name does not overstate coverage. Matches
        # clean-install-gate.yml. Non-Linux cells run unhardened by platform
        # limitation.
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Build platform archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p archive-out
          digest_line=$(python scripts/build_release_tarball.py \
            --root . \
            --out-dir archive-out \
            --name apothem \
            --version "${version}" \
            --platform "${{ matrix.platform }}")
          printf '%s\n' "${digest_line}" > "archive-out/${{ matrix.platform }}.sha256"
          printf '%s\n' "${digest_line}"
      - name: Upload platform archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: archive-${{ matrix.platform }}
          path: archive-out/
          retention-days: 7

  sign-archives:
    name: sign platform archives + manifest (cosign keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [archive-build]
    permissions:
      contents: read
      id-token: write   # OIDC for Sigstore keyless signing
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Download archive artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: archive-*
          path: archives/
          merge-multiple: true
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        with:
          # The cosign v2 -> v3 major is an operator decision; pin the
          # binary explicitly so an installer bump never moves it implicitly.
          cosign-release: 'v2.6.3'
      - name: Aggregate SHA256SUMS manifest
        run: |
          set -euo pipefail
          cd archives
          cat darwin.sha256 linux.sha256 windows.sha256 > SHA256SUMS
          rm -f darwin.sha256 linux.sha256 windows.sha256
          cat SHA256SUMS
      - name: Sign each archive (keyless)
        run: |
          set -euo pipefail
          cd archives
          # One naming scheme for every bundle: <asset>.cosign.bundle. These
          # were "<asset>.sig" up to v1.1.0, a name that suggests a detached
          # signature rather than a Sigstore bundle.
          for f in *.tar.gz *.zip; do
            [ -e "${f}" ] || continue
            cosign sign-blob --yes \
              --bundle "${f}.cosign.bundle" \
              "${f}"
          done
      - name: Sign SHA256SUMS manifest (keyless)
        run: |
          set -euo pipefail
          cd archives
          cosign sign-blob --yes \
            --bundle SHA256SUMS.cosign.bundle \
            SHA256SUMS
      - name: Upload signed archives + manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: archives-signed
          path: archives/
          retention-days: 90

  publish:
    name: publish GitHub Release
    # `attest` (the GitHub-native build-provenance attestation) is intentionally
    # NOT in this needs list: it is a supplementary record to GitHub's
    # attestation store, not a release gate. The gating supply-chain evidence is
    # the portable SLSA provenance (verify-provenance) plus the cosign
    # signatures (sign / sign-archives) attached to the Release. A transient
    # attestation-store failure must not block a fully-signed, provenance-backed
    # release; the attestation is verifiable independently via `gh attestation
    # verify` once it lands.
    needs: [build, sign, verify-provenance, archive-build, sign-archives]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write   # GitHub Releases need write access to the release surface
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Download cosign bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cosign-bundles
          path: dist/
      - name: Download signed platform archives + SHA256SUMS manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: archives-signed
          path: archives/
      - name: Download SLSA provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: provenance.intoto.jsonl
          path: ./
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/release/extract_release_notes.py \
            --version "${VERSION}" \
            --changelog CHANGELOG.md \
            --output release-notes.md
          {
            echo "version=${VERSION}"
            echo "notes_path=release-notes.md"
          } >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        # The runner's preinstalled gh CLI publishes the release, so no
        # third-party action holds this job's contents:write token (zizmor
        # superfluous-actions). The first run creates the release on the
        # pushed tag with every asset. A re-run of this job finds the release
        # already there, so it refreshes the title and notes and uploads the
        # assets again with --clobber, which replaces an asset of the same name.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.notes.outputs.version }}
          NOTES_PATH: ${{ steps.notes.outputs.notes_path }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/* provenance.intoto.jsonl archives/*)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "v${VERSION}" \
              --notes-file "${NOTES_PATH}" --draft=false --prerelease=false
            gh release upload "${TAG}" --clobber "${assets[@]}"
          else
            gh release create "${TAG}" --verify-tag --title "v${VERSION}" \
              --notes-file "${NOTES_PATH}" "${assets[@]}"
          fi
