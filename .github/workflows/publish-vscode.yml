# SPDX-License-Identifier: MIT

# VS Code extension publication workflow.
#
# Trigger: a `v*.*.*` tag push (publishes alongside release.yml and
# publish-npm.yml) OR a manual workflow_dispatch with an explicit tag.
# Packages the extension under `vscode-extension/` into a `.vsix` and publishes
# it to the Visual Studio Marketplace, so the extension installs across VS Code
# and GitHub Copilot.
#
# Authentication: the `Select Marketplace credential` step chooses one of two
# credentials, or none. With the repository variable `VSCE_AUTH=entra` and the
# variables `AZURE_CLIENT_ID` and `AZURE_TENANT_ID`, the job signs in to
# Microsoft Entra ID through a GitHub OIDC federated credential (Azure/login,
# no stored secret) and vsce publishes with `--azure-credential`, using a
# short-lived token. Otherwise the `VSCE_PAT` personal-access-token secret
# publishes, as before. Either path needs the repository variable
# `VSCODE_MARKETPLACE_READY=true`. When no credential is configured the publish
# steps are SKIPPED — never failed — so a release without one still runs green
# and produces the packaged `.vsix` artifact. The maintainer adds the
# publisher (`ahmed-g-gad`) membership or the token before the first publish.
# The credential is a switch, not a retry: a failed Entra publish does not fall
# back to the PAT, so flip `VSCE_AUTH` and dispatch again. On the Entra route a
# manual dispatch with `dry_run` signs in and verifies publisher access without
# publishing. The PAT route has no dry run: there the dispatch only warns that
# nothing was verified. The values of `VSCE_AUTH` and `VSCODE_MARKETPLACE_READY`
# are compared without regard to case, as a GitHub expression would.
#
# SHA-pinning policy mirrors the other workflows: every action `uses:` reference
# is pinned by 40-character commit SHA followed by a `# vMAJOR.MINOR.PATCH`
# version comment.

name: Publish VS Code Extension

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package and publish (e.g. v0.0.1).
        required: true
        type: string
      dry_run:
        description: Entra route only - sign in with Entra ID and verify publisher access. Publishes nothing.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-vscode-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:

  publish:
    name: package + publish (Marketplace)
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    # A job-level block replaces the workflow-level one, so contents: read is
    # repeated.
    permissions:
      contents: read
      id-token: write   # OIDC for the Entra federated credential (Azure/login)
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Checkout the vsce lockfile
        # The tag being packaged may predate .github/vsce, so the packager comes
        # from the lockfile at the commit this workflow runs from.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: vsce-tool
          sparse-checkout: .github/vsce
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          # No dependency cache in a publishing job, since a restored cache could
          # carry poisoned packages into the release (zizmor cache-poisoning).
          # setup-node turns npm caching on by itself when package.json names
          # npm as its packageManager, so it is switched off explicitly.
          package-manager-cache: false
      - name: Validate package version matches tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          actual="$(node -p "require('./package.json').version")"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::vscode-extension/package.json version ${actual} does not match tag ${RELEASE_TAG}"
            exit 1
          fi
      # vsce and its whole dependency tree are pinned by version and integrity
      # hash in .github/vsce/package-lock.json, the lockfile release.yml uses,
      # and --ignore-scripts runs no dependency install script. Bump it there.
      # Its package.json overrides @azure/msal-node to 7.1.1, which fixes
      # GHSA-xcx6-jx8p-x3h5: @azure/identity 4.14 still pins msal-node ^6.
      # The Entra publish path loads @azure/identity, so the affected flow can be
      # reached and the override stays. The PAT path does not load it.
      # Drop the override once @azure/identity requires msal-node 7.1 or later.
      - name: Install vsce from its lockfile
        run: npm ci --prefix ../vsce-tool/.github/vsce --ignore-scripts --no-audit --no-fund
      - name: Package .vsix
        run: ../vsce-tool/.github/vsce/node_modules/.bin/vsce package --no-dependencies --out apothem.vsix
      # The `secrets` context is not a valid context inside an `if:` expression
      # (GitHub allows env / steps / github / vars / … there, not secrets), so a
      # `if: ${{ secrets.VSCE_PAT != '' }}` gate makes the workflow fail to start.
      # This selection step reads the secret and the variables into a step-scoped
      # env and exports only a mode (entra, pat or none) — never the token itself
      # — that the gated steps key their `if:` on, keeping the token scoped to
      # the single step that consumes it. The Entra steps never receive VSCE_PAT,
      # because vsce prefers it over --azure-credential, and never receive
      # AZURE_CLIENT_ID, so vsce reads the token from the Azure CLI session that
      # Azure/login opened and not from environment credentials. Azure/login runs
      # directly before the vsce steps because az reuses the GitHub OIDC token
      # for later token requests.
      - name: Select Marketplace credential
        id: auth
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSCE_AUTH: ${{ vars.VSCE_AUTH }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          MARKETPLACE_READY: ${{ vars.VSCODE_MARKETPLACE_READY }}
        run: |
          set -euo pipefail
          # Compare without regard to case, as a GitHub expression would, so
          # True and TRUE enable the publish as true does.
          ready="${MARKETPLACE_READY:-}"
          auth="${VSCE_AUTH:-}"
          mode=none
          if [ "${ready,,}" = "true" ]; then
            if [ "${auth,,}" = "entra" ] && [ -n "${AZURE_CLIENT_ID:-}" ] && [ -n "${AZURE_TENANT_ID:-}" ]; then
              mode=entra
            else
              if [ "${auth,,}" = "entra" ]; then
                echo "::warning title=Entra variables incomplete::VSCE_AUTH=entra but AZURE_CLIENT_ID or AZURE_TENANT_ID is empty, so the Entra route is not used."
              fi
              if [ -n "${VSCE_PAT:-}" ]; then
                mode=pat
              fi
            fi
          fi
          echo "Marketplace credential mode: ${mode}"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
      - name: Sign in to Microsoft Entra ID
        if: ${{ steps.auth.outputs.mode == 'entra' }}
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Dry run - print the Azure DevOps profile id
        if: ${{ steps.auth.outputs.mode == 'entra' && inputs.dry_run }}
        run: >-
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me
          --resource 499b84ac-1321-427f-aa17-267ca6975798
          --query '{id: id, displayName: displayName}' -o json
      - name: Dry run - verify publisher access
        if: ${{ steps.auth.outputs.mode == 'entra' && inputs.dry_run }}
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          publisher="$(node -p "require('./package.json').publisher")"
          ../vsce-tool/.github/vsce/node_modules/.bin/vsce verify-pat "${publisher}" --azure-credential
      - name: Dry run - the PAT route has no dry run
        # Without this step a dry run on the PAT route is a green run that
        # verified nothing.
        if: ${{ steps.auth.outputs.mode == 'pat' && inputs.dry_run }}
        run: |
          echo "::warning title=Dry run verified nothing::The PAT route has no dry run, so nothing was signed in, verified or published. Set VSCE_AUTH=entra with AZURE_CLIENT_ID and AZURE_TENANT_ID to dry-run the Entra route."
      - name: Publish to Visual Studio Marketplace (Entra ID)
        # No VSCE_PAT: vsce prefers it over --azure-credential. No AZURE_CLIENT_ID either.
        if: ${{ steps.auth.outputs.mode == 'entra' && !inputs.dry_run }}
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: ../vsce-tool/.github/vsce/node_modules/.bin/vsce publish --no-dependencies --packagePath apothem.vsix --azure-credential
      - name: Publish to Visual Studio Marketplace (PAT fallback)
        # vsce reads VSCE_PAT natively, so the token is never a process argument.
        if: ${{ steps.auth.outputs.mode == 'pat' && !inputs.dry_run }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: ../vsce-tool/.github/vsce/node_modules/.bin/vsce publish --no-dependencies --packagePath apothem.vsix
      - name: Marketplace publish skipped (not yet enabled)
        if: ${{ steps.auth.outputs.mode == 'none' }}
        run: |
          echo "::notice title=Marketplace publish skipped::Set VSCODE_MARKETPLACE_READY=true and either VSCE_AUTH=entra with AZURE_CLIENT_ID and AZURE_TENANT_ID, or the VSCE_PAT secret, to publish ahmed-g-gad.apothem-vscode on the next tag. The packaged apothem.vsix artifact was still produced."
