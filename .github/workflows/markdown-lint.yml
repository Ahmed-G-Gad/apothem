# SPDX-License-Identifier: MIT

# Markdown lint: run the repository's own markdownlint pre-commit hook in CI.
#
# The hook (pinned by `rev` in .pre-commit-config.yaml, policy in
# .markdownlint.json) only ran on contributors' machines, so findings landed
# unnoticed: 18 sat on main before this job existed. Running the hook through
# pre-commit keeps one source for its version, and a Dependabot pull request
# that bumps the hook is linted with the new version before it merges.
#
# SHA-pinning policy mirrors ci.yml: every action `uses:` reference is pinned by
# 40-character commit SHA followed by a `# vMAJOR.MINOR.PATCH` version comment.
# Dependabot (.github/dependabot.yml) proposes a bump for each pinned SHA
# weekly.

name: Markdown Lint

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - ".pre-commit-config.yaml"
      - ".github/workflows/markdown-lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - ".pre-commit-config.yaml"
      - ".github/workflows/markdown-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Single-sourced pip pin; scripts/dev/check_pip_pin_drift.py keeps it equal
  # across every workflow that installs pip.
  PIP_PIN_VERSION: "26.2.1"

concurrency:
  group: markdown-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          # pre-commit fetches the hook repository and its npm dependencies, so
          # egress is audited rather than blocked.
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install pre-commit
        # Exact pin, like the other workflow-only pip tools
        # (dependency-pinning manifest, CI-only tools row).
        run: |
          python -m pip install "pip==${PIP_PIN_VERSION}"
          python -m pip install "pre-commit==4.7.0"
      - name: Run the markdownlint hook
        run: pre-commit run markdownlint --all-files --show-diff-on-failure
