# SPDX-License-Identifier: MIT

# Documentation-only pull-request status-check stub.
#
# The `main` ruleset requires the `quality / <os> / py<ver>` matrix and the
# `coverage` status checks. Those live in `ci.yml`, which triggers on every
# code-and-config surface (CHANGELOG.md, src/**, tests/**, pyproject.toml,
# site/**, examples/**, scripts/**, .github/workflows/**,
# .pre-commit-config.yaml, .gitleaks.toml). A pull request that touches ONLY documentation outside that
# set never runs them, so the required contexts would stay "expected" forever
# and the PR could not merge.
#
# This workflow's `paths-ignore` is the EXACT complement of `ci.yml`'s trigger
# `paths` (kept in lockstep — the complement is asserted by
# `tests/scripts/test_required_check_coverage.py`). But `paths` and
# `paths-ignore` are both ANY-match triggers, so a MIXED docs+code PR satisfies
# both filters and would start BOTH workflows on the same context names — the
# stub could then report a required check green over a real code change.
#
# A `gate` job closes that: it inspects the PR's changed files once and emits a
# docs_only boolean, and the reporting jobs run only when it is true. On a
# mixed PR they are SKIPPED, so the stub publishes no conclusion on a context
# `ci.yml` also reports. The reporting jobs keep their own assertion as a
# second line of defence — if one ever runs on a gated diff it still fails
# rather than fabricating a green.
#
# Skipping rather than failing matters for enforcement, not just tidiness: a
# required status check resolves to the latest run for a given name, so while
# the stub published a red `quality / …` beside `ci.yml`'s green one, which
# result governed the merge depended on which finished last.
#
# The honest green path is therefore: a purely-documentation PR runs this stub
# (gate says docs-only, contexts report green); any PR touching a gated surface
# runs `ci.yml`'s REAL quality+coverage and this stub stands aside.

name: CI Docs Stub

on:
  # Manual dispatch renders an honest green no-op run (the dispatch-noop job
  # below): there is no pull-request diff to gate, so the required quality and
  # coverage contexts are skipped and never fabricated. The pull_request path
  # is the real gate.
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'site/**'
      - 'examples/**'
      - 'scripts/**'
      - 'evals/**'
      - '.github/workflows/**'
      - '.pre-commit-config.yaml'
      - '.gitleaks.toml'

permissions:
  contents: read

concurrency:
  group: ci-docs-stub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Resolves the docs-only question ONCE, as a boolean the reporting jobs
    # gate on. Previously each reporting job asserted docs-only and failed when
    # a gated surface was present. That was safe -- it never fabricated a green
    # -- but it left a mixed PR with the same context name published twice, red
    # by this workflow and green by ci.yml. A required status check resolves to
    # the latest run for a name, so enforcement became timing-dependent.
    # Skipping the job instead publishes no failure to collide with.
    name: Docs-only gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Resolve docs-only status
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # The `if` swallows the script's non-zero exit deliberately: here a
        # gated surface is an answer, not an error. The script keeps its
        # failing exit for the assertion the reporting jobs still run.
        run: |
          if bash .github/workflows/scripts/assert-docs-only.sh; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: quality / ${{ matrix.os }} / py${{ matrix.python-version }}
    needs: gate
    if: github.event_name == 'pull_request' && needs.gate.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Assert documentation-only change
        # Self-gating guard: a mixed docs+code PR satisfies this workflow's
        # paths-ignore ANY-match trigger too, so confirm no gated surface is in
        # the diff before reporting success. If any is, `ci.yml`'s real job owns
        # this context — fail rather than fabricate a green.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          bash .github/workflows/scripts/assert-docs-only.sh
      - name: Documentation-only change
        run: echo "Documentation-only change — the quality matrix does not apply; reporting success to satisfy the required check."

  coverage:
    name: coverage
    needs: gate
    if: github.event_name == 'pull_request' && needs.gate.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Assert documentation-only change
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          bash .github/workflows/scripts/assert-docs-only.sh
      - name: Documentation-only change
        run: echo "Documentation-only change — coverage does not apply; reporting success to satisfy the required check."

  dispatch-noop:
    name: Manual dispatch no-op
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: No-op
        run: |
          echo "Manual dispatch — no pull-request diff to gate; CI Docs Stub is a no-op here. The pull_request path is the real gate."
