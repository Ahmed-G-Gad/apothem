# SPDX-License-Identifier: MIT

# Per-harness install + verify matrix.
# Every PR and push to main fans out across all 17 registered harness adapters.
# Each job: build wheel → install apothem → create minimal profile → install
# harness → verify → uninstall. Sandbox home via $HOME override.
# Required status check: harness-matrix / matrix (<name>)

name: Harness Matrix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/apothem/harnesses/**'
      - 'tests/harnesses/**'
      - 'pyproject.toml'
      - '.github/workflows/harness-matrix.yml'
  pull_request:
    branches: [main]
    # No `paths:` filter on the pull_request trigger. The matrix job
    # `matrix (<name>)` is a branch-protection required status check (see the
    # header comment above); a required check gated by `paths:` is silently
    # skipped on a PR that touches none of those paths, and a skipped required
    # check is an escape — it can never report and so never gates. Running on
    # every PR to main closes that escape. The `push` trigger keeps its
    # path filter because pushes are not the required-check surface.

permissions:
  contents: read

concurrency:
  group: harness-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Install build backend
        run: python -m pip install --require-hashes -r scripts/release/requirements-build-linux.txt
      - name: Build wheel
        run: python -m build --wheel
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: apothem-wheel
          path: dist/*.whl
          retention-days: 1

  matrix:
    name: matrix (${{ matrix.harness }})
    needs: build-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        harness:
          - claude-code
          - cursor
          - gemini-cli
          - github-copilot
          - codex
          - windsurf
          - opencode
          - antigravity
          - open-claw
          - hermes
          - qwen-code
          - codebuddy
          - kiro
          - trae
          - zed
          - kimi-code
          - glm

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: apothem-wheel
          path: dist/

      - name: Install apothem
        run: python -m pip install dist/*.whl

      - name: Scaffold sandbox home + profile
        run: |
          SANDBOX="$(mktemp -d)"
          echo "SANDBOX_HOME=$SANDBOX" >> "$GITHUB_ENV"
          mkdir -p "$SANDBOX/.config/apothem"
          cat > "$SANDBOX/.config/apothem/profile.yaml" <<'PROFILE'
          identity:
            name: CI Test User
            role: software engineer
          preferences:
            language: python
            style: concise
          seriousness: PERSONAL_USE
          PROFILE

      - name: Resolve project scope
        # Project-scope adapters (requires_project = True) materialize into
        # an operator-supplied project tree, so every lifecycle command needs
        # --project. User-scope adapters take none. PROJECT_DIR is empty for
        # the latter; each lifecycle step expands it into "--project <dir>"
        # through a quoted bash array.
        run: |
          case "${{ matrix.harness }}" in
            cursor|gemini-cli|github-copilot|windsurf|codebuddy|kiro|trae|zed|kimi-code|glm)
              echo "PROJECT_DIR=$(mktemp -d)" >> "$GITHUB_ENV"
              ;;
            *)
              echo "PROJECT_DIR=" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Install harness
        env:
          HOME: ${{ env.SANDBOX_HOME }}
        run: |
          scope=()
          if [ -n "$PROJECT_DIR" ]; then scope=(--project "$PROJECT_DIR"); fi
          python -m apothem install \
            --harness "${{ matrix.harness }}" \
            --profile "$SANDBOX_HOME/.config/apothem/profile.yaml" \
            "${scope[@]}"

      - name: Verify harness
        env:
          HOME: ${{ env.SANDBOX_HOME }}
        run: |
          scope=()
          if [ -n "$PROJECT_DIR" ]; then scope=(--project "$PROJECT_DIR"); fi
          python -m apothem verify \
            --harness "${{ matrix.harness }}" \
            "${scope[@]}"

      - name: Uninstall harness
        env:
          HOME: ${{ env.SANDBOX_HOME }}
        run: |
          scope=()
          if [ -n "$PROJECT_DIR" ]; then scope=(--project "$PROJECT_DIR"); fi
          python -m apothem uninstall \
            --harness "${{ matrix.harness }}" \
            --yes \
            "${scope[@]}"

      - name: Assert clean uninstall
        env:
          HOME: ${{ env.SANDBOX_HOME }}
        run: |
          scope=()
          if [ -n "$PROJECT_DIR" ]; then scope=(--project "$PROJECT_DIR"); fi
          if python -m apothem verify --harness "${{ matrix.harness }}" "${scope[@]}" 2>&1; then
            echo "::error::Harness ${{ matrix.harness }} still installed after uninstall"
            exit 1
          fi
          echo "Clean uninstall confirmed for ${{ matrix.harness }}"
