# SPDX-License-Identifier: MIT

# zizmor — static analysis for GitHub Actions workflow security.
# Audits every workflow under .github/ for template injection, credential
# persistence, unpinned actions, and excessive permissions; SARIF uploaded
# to the GitHub Security tab.
# Ref: https://github.com/zizmorcore/zizmor-action

name: Zizmor

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SARIF upload to code scanning requires public-repo access via
    # GITHUB_TOKEN; skip on private repos (Resource not accessible by
    # integration). Job auto-activates when the repo is made public — no
    # further config change required.
    if: github.event.repository.private == false
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # Audit egress: this job checks out the repo, runs the zizmor
          # workflow auditor (a composite action that downloads a hash-locked
          # zizmor wheel from PyPI with pip and unpacks it), and uploads SARIF
          # to code scanning. Audit mode records every egress destination
          # without an allowlist, so the wheel download proceeds without a
          # maintained endpoint list while the run's network activity stays
          # observable.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd  # v0.8.1
