# SPDX-License-Identifier: MIT

# Dependency Review — blocks pull requests that introduce dependencies with
# known vulnerabilities or disallowed licenses, evaluated against the diff of
# the manifest/lockfiles. Complements the weekly pip-audit and Trivy scans with
# a PR-time gate (OpenSSF Scorecard Dependency-Update-Tool / supply-chain).
# Ref: https://github.com/actions/dependency-review-action

name: Dependency Review

on:
  # Manual dispatch renders an honest green no-op run (the dispatch-noop job
  # below): there is no pull-request diff to review, so the review job is
  # skipped rather than run against a missing base/head pair. The pull_request
  # path is the real gate.
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          # Block egress: this job checks out the repo and calls the GitHub
          # dependency-graph API through dependency-review-action. Endpoints
          # cover action-tarball fetch, the GitHub API/clone surface, and the
          # one third-party host the action itself reaches.
          #
          # api.deps.dev is Google's Open Source Insights, which
          # dependency-review-action queries to resolve dependency license
          # metadata. Without it the action fails with a bare "fetch failed" --
          # the block shows up only in the harden-runner agent log, as
          # "ip address dropped" against the resolved deps.dev address, so the
          # symptom reads like a transient network blip and is not one. The
          # gate reports failure rather than a false pass in that state, so no
          # review was ever silently skipped.
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            api.deps.dev:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          # MIT-compatible permissive licenses only, expressed as current SPDX
          # identifiers. This mirrors the license-audit.yml allow-only list so
          # the two license gates agree: an unknown or copyleft license fails
          # both, rather than dependency-review passing what license-audit
          # rejects. An allow-list also avoids the deprecated bare `GPL-3.0`
          # deny forms that miss the `-only` / `-or-later` SPDX variants modern
          # package metadata declares.
          allow-licenses: MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, PSF-2.0, Unlicense, MPL-2.0
          # Named exception, deliberately per-package rather than a licence
          # added to the list above. The @img/sharp-libvips-* packages are
          # prebuilt libvips binaries under LGPL-3.0-or-later, pulled in
          # transitively by Next.js image optimization. They are platform
          # artifacts consumed at build time, not code this project
          # redistributes in its sdist or wheel.
          #
          # They are not new: main already carried all ten at 1.2.4 under the
          # same licence. Dependency review compares head against base, so it
          # reports them only when the version moves -- the licence question
          # predates any single bump and is answered here once, by name.
          #
          # Listing the packages keeps the allow-list itself permissive-only:
          # a future LGPL dependency outside this set still fails the gate
          # rather than inheriting an exception made for these binaries.
          #
          # The set is derived by licence, not by name: the sharp-libvips-*
          # packages declare LGPL alone, while sharp-wasm32 and the sharp-win32-*
          # variants link libvips statically and declare it inside a compound
          # `Apache-2.0 AND LGPL-3.0-or-later` expression. Enumerating on the
          # name prefix alone misses those four. Re-derive with: every entry in
          # site/package-lock.json whose `license` string contains "LGPL".
          allow-dependencies-licenses: >-
            pkg:npm/%40img/sharp-libvips-darwin-arm64,
            pkg:npm/%40img/sharp-libvips-darwin-x64,
            pkg:npm/%40img/sharp-libvips-linux-arm,
            pkg:npm/%40img/sharp-libvips-linux-arm64,
            pkg:npm/%40img/sharp-libvips-linux-ppc64,
            pkg:npm/%40img/sharp-libvips-linux-riscv64,
            pkg:npm/%40img/sharp-libvips-linux-s390x,
            pkg:npm/%40img/sharp-libvips-linux-x64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-x64,
            pkg:npm/%40img/sharp-wasm32,
            pkg:npm/%40img/sharp-win32-arm64,
            pkg:npm/%40img/sharp-win32-ia32,
            pkg:npm/%40img/sharp-win32-x64
          comment-summary-in-pr: never

  dispatch-noop:
    name: Manual dispatch no-op
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: No-op
        run: |
          echo "Manual dispatch — no pull-request diff to review; Dependency Review is a no-op here. The pull_request path is the real gate."
