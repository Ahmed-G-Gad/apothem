# SPDX-License-Identifier: MIT

# Dependency Review — blocks pull requests that introduce dependencies with
# known vulnerabilities or disallowed licenses, evaluated against the diff of
# the manifest/lockfiles. Complements the weekly pip-audit and Trivy scans with
# a PR-time gate (OpenSSF Scorecard Dependency-Update-Tool / supply-chain).
# The review runs only while the repository is public. See the `if:` on the
# review job.
# Ref: https://github.com/actions/dependency-review-action

name: Dependency Review

on:
  # Manual dispatch renders an honest green no-op run (the dispatch-noop job
  # below): there is no pull-request diff to review, so the review job is
  # skipped rather than run against a missing base/head pair. The pull_request
  # path is the real gate.
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency review
    # Dependency review is free on public repositories and needs GitHub Code
    # Security on private ones. Without it, a private run fails with
    # "Dependency review is not supported on this repository". Skip on
    # private repos instead, as scorecard.yml and zizmor.yml do. The gate
    # runs again unchanged once the repository is public.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          # Block egress: this job checks out the repo and calls the GitHub
          # dependency-graph API through dependency-review-action. Endpoints
          # cover action-tarball fetch, the GitHub API/clone surface, and the
          # one third-party host the action itself reaches.
          #
          # api.deps.dev is Google's Open Source Insights, which
          # dependency-review-action queries to resolve dependency license
          # metadata. Without it the action fails with a bare "fetch failed" --
          # the block shows up only in the harden-runner agent log, as
          # "ip address dropped" against the resolved deps.dev address, so the
          # symptom reads like a transient network blip and is not one. The
          # gate reports failure rather than a false pass in that state, so no
          # review was ever silently skipped.
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            api.deps.dev:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          # MIT-compatible permissive licenses only, expressed as current SPDX
          # identifiers. This mirrors the license-audit.yml allow-only list so
          # the two license gates agree: an unknown or copyleft license fails
          # both, rather than dependency-review passing what license-audit
          # rejects. An allow-list also avoids the deprecated bare `GPL-3.0`
          # deny forms that miss the `-only` / `-or-later` SPDX variants modern
          # package metadata declares.
          allow-licenses: MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, PSF-2.0, Unlicense, MPL-2.0
          # Named exception, deliberately per-package rather than a licence
          # added to the list above. The @img/sharp-libvips-* packages are
          # prebuilt libvips binaries under LGPL-3.0-or-later, pulled in
          # transitively by Next.js image optimization. They are platform
          # artifacts consumed at build time, not code this project
          # redistributes in its sdist or wheel.
          #
          # They are not new: main already carried all ten at 1.2.4 under the
          # same licence. Dependency review compares head against base, so it
          # reports them only when the version moves -- the licence question
          # predates any single bump and is answered here once, by name.
          #
          # Listing the packages keeps the allow-list itself permissive-only:
          # a future LGPL dependency outside this set still fails the gate
          # rather than inheriting an exception made for these binaries.
          #
          # The set is derived by licence, not by name: the sharp-libvips-*
          # packages declare LGPL alone, while sharp-wasm32 and the sharp-win32-*
          # variants link libvips statically and declare it inside a compound
          # `Apache-2.0 AND LGPL-3.0-or-later` expression. Enumerating on the
          # name prefix alone misses those four. Re-derive with: every entry in
          # site/package-lock.json whose `license` string contains "LGPL".
          #
          # Second named exception: the CI tool lockfiles. .github/channel-smoke
          # pins the Claude Code, Gemini CLI, Codex and Qwen Code CLIs that
          # channel-smoke.yml installs to smoke each install channel, and
          # .github/vsce pins the vsce packager the release and publish-vscode
          # jobs install. Both are installed by npm ci inside CI jobs only, and
          # neither tree ships: the sdist and wheel carry no npm code, and the
          # vsix holds only vscode-extension/, which declares no dependencies.
          # The Claude Code and @vscode/vsce-sign packages are proprietary. The
          # rest declare permissive licences outside the list above
          # (Artistic-2.0, BlueOak-1.0.0, 0BSD), or declare MIT while GitHub's
          # licence detection adds CC0-1.0, Unicode or unknown references
          # (lodash.*, xmlbuilder, typed-rest-client).
          #
          # The action matches each entry by package name alone: it applies in
          # every manifest and at every version, so the two tslib entries in
          # site/package-lock.json are exempt too. Excluded packages are
          # never evaluated or printed. To re-derive the list, remove these
          # entries on a branch that changes one of the two lockfiles and read
          # the "incompatible licenses" list Dependency review prints.
          allow-dependencies-licenses: >-
            pkg:npm/%40img/sharp-libvips-darwin-arm64,
            pkg:npm/%40img/sharp-libvips-darwin-x64,
            pkg:npm/%40img/sharp-libvips-linux-arm,
            pkg:npm/%40img/sharp-libvips-linux-arm64,
            pkg:npm/%40img/sharp-libvips-linux-ppc64,
            pkg:npm/%40img/sharp-libvips-linux-riscv64,
            pkg:npm/%40img/sharp-libvips-linux-s390x,
            pkg:npm/%40img/sharp-libvips-linux-x64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-x64,
            pkg:npm/%40img/sharp-wasm32,
            pkg:npm/%40img/sharp-win32-arm64,
            pkg:npm/%40img/sharp-win32-ia32,
            pkg:npm/%40img/sharp-win32-x64,
            pkg:npm/%40anthropic-ai/claude-code,
            pkg:npm/%40anthropic-ai/claude-code-darwin-arm64,
            pkg:npm/%40anthropic-ai/claude-code-darwin-x64,
            pkg:npm/%40anthropic-ai/claude-code-linux-arm64,
            pkg:npm/%40anthropic-ai/claude-code-linux-arm64-musl,
            pkg:npm/%40anthropic-ai/claude-code-linux-x64,
            pkg:npm/%40anthropic-ai/claude-code-linux-x64-musl,
            pkg:npm/%40anthropic-ai/claude-code-win32-arm64,
            pkg:npm/%40anthropic-ai/claude-code-win32-x64,
            pkg:npm/%40vscode/vsce-sign,
            pkg:npm/%40vscode/vsce-sign-alpine-arm64,
            pkg:npm/%40vscode/vsce-sign-alpine-x64,
            pkg:npm/%40vscode/vsce-sign-darwin-arm64,
            pkg:npm/%40vscode/vsce-sign-darwin-x64,
            pkg:npm/%40vscode/vsce-sign-linux-arm,
            pkg:npm/%40vscode/vsce-sign-linux-arm64,
            pkg:npm/%40vscode/vsce-sign-linux-x64,
            pkg:npm/%40vscode/vsce-sign-win32-arm64,
            pkg:npm/%40vscode/vsce-sign-win32-x64,
            pkg:npm/binaryextensions,
            pkg:npm/editions,
            pkg:npm/istextorbinary,
            pkg:npm/lodash.includes,
            pkg:npm/lodash.isinteger,
            pkg:npm/lodash.isplainobject,
            pkg:npm/lodash.once,
            pkg:npm/minimatch,
            pkg:npm/sax,
            pkg:npm/textextensions,
            pkg:npm/tslib,
            pkg:npm/typed-rest-client,
            pkg:npm/version-range,
            pkg:npm/xmlbuilder
          comment-summary-in-pr: never

  dispatch-noop:
    name: Manual dispatch no-op
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: No-op
        run: |
          echo "Manual dispatch — no pull-request diff to review; Dependency Review is a no-op here. The pull_request path is the real gate."
