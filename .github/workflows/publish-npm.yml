# SPDX-License-Identifier: MIT

# npm publication workflow.
#
# Trigger: a `v*.*.*` tag push (auto-publishes on release, in parallel with
# release.yml's GitHub-Release job) OR a manual workflow_dispatch with an
# explicit tag. Publishes the root npm package `@ahmed-g-gad/apothem` to
# registry.npmjs.org for the release tag, so `npx @ahmed-g-gad/apothem`
# resolves the released tree. The tag is the pushed ref on a tag push, or the
# dispatch input on a manual run (`inputs.tag || github.ref_name`).
#
# Authentication: npm trusted publishing (OIDC). The package's trusted
# publisher on npmjs.com names this repository and this workflow file; the npm
# CLI (11.5.1 or newer) exchanges the job's GitHub Actions OIDC token
# (`id-token: write`) for a short-lived publish credential. No registry token
# is stored in the repository: 1.0.2 and 1.1.0 were published this way, and a
# leftover long-lived token would only widen the publish attack surface.
# `--provenance` keeps the Sigstore provenance statement explicit (trusted
# publishing also emits it by default for a public package).
#
# Operator follow-up outside this file: on npmjs.com, set the package's
# publishing access to "Require two-factor authentication and disallow
# tokens", and delete any leftover npm token secret from the repository.
#
# Idempotency: a registry version is immutable — npm rejects re-publishing an
# existing `name@version`. So the publish step first checks whether the tagged
# version is already on the registry and skips publication when it is, which
# keeps a re-cut / re-tag of an already-published release green rather than
# failing on the duplicate-version error.
#
# SHA-pinning policy mirrors ci.yml: every action `uses:` reference is
# pinned by 40-character commit SHA followed by a `# vMAJOR.MINOR.PATCH`
# version comment. Renovate (renovate.json) bumps each pinned SHA weekly.

name: Publish npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to npm (e.g. v0.0.1).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:

  publish:
    name: publish to registry.npmjs.org
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # OIDC for npm trusted publishing + --provenance
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          # Node 24 is the npm trusted-publishing runtime floor.
          node-version: "24"
          registry-url: https://registry.npmjs.org
          # No dependency cache in a publishing job, since a restored cache could
          # carry poisoned packages into the release (zizmor cache-poisoning).
          # setup-node turns npm caching on by itself when package.json names
          # npm as its packageManager, so it is switched off explicitly.
          package-manager-cache: false
      - name: Check the npm CLI meets the trusted-publishing floor
        # The OIDC token exchange requires npm CLI 11.5.1 or newer. Current
        # Node 24 releases bundle a newer npm (24.18.0 ships 11.16.0), so this
        # check replaces a global `npm install -g npm@11.5.1`, which installed
        # outside any lockfile (zizmor adhoc-packages) and downgraded the
        # bundled CLI.
        run: |
          set -euo pipefail
          required="11.5.1"
          actual="$(npm --version)"
          lowest="$(printf '%s\n%s\n' "${required}" "${actual}" | sort -V | head -n 1)"
          if [ "${lowest}" != "${required}" ]; then
            echo "::error::npm ${actual} is older than ${required}, the trusted-publishing floor"
            exit 1
          fi
          echo "npm ${actual} meets the ${required} floor"
      - name: Validate package version matches tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          actual="$(node -p "require('./package.json').version")"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::package.json version ${actual} does not match dispatched tag ${RELEASE_TAG}"
            exit 1
          fi
          name="$(node -p "require('./package.json').name")"
          if [ "${name}" != "@ahmed-g-gad/apothem" ]; then
            echo "::error::package.json name ${name} is not @ahmed-g-gad/apothem"
            exit 1
          fi
      - name: Publish to npm (OIDC trusted publishing + provenance)
        # Authenticates through npm trusted publishing: the npm CLI exchanges
        # this job's OIDC token (id-token: write above) for a short-lived
        # publish credential, so no token is configured here. Publication is
        # idempotent: a registry version is immutable, so if this version is
        # already on the registry the step skips publication (a re-cut / re-tag
        # of an already-published release stays green) rather than failing on
        # npm's duplicate-version error.
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "@ahmed-g-gad/apothem@${version}" version >/dev/null 2>&1; then
            echo "::notice title=npm publish skipped::@ahmed-g-gad/apothem@${version} is already published to registry.npmjs.org; an npm version is immutable, so re-publishing is a no-op. Nothing to do."
          else
            npm publish --provenance --access public
          fi
