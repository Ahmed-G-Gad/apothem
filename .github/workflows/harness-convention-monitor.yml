# SPDX-License-Identifier: MIT

# Harness-convention freshness monitor.
#
# Enforces the 90-day freshness cadence on each harness adapter's
# STANDARD-CONVENTION-PIN.md. The monitor reads the adapter-local pin
# files, validates snapshot dates, and files a drift-alert GitHub issue
# when any pin is missing, malformed, future-dated, or stale.
#
# Schedule: 00:00 UTC on the 1st of every third month (approx. 90-day
# cadence). Manual fire via workflow_dispatch.
#
# SHA-pinning policy mirrors sibling workflows; every `uses:` reference
# is pinned by 40-char commit SHA followed by a `# vX.Y.Z` version
# comment. Refresh on Renovate bump.

name: Harness Convention Monitor

on:
  schedule:
    - cron: '0 0 1 */3 *'   # 00:00 UTC on the 1st of every third month
  workflow_dispatch:

permissions:
  contents: read

# Single-sourced pip pin (CVE-2026-13346 closes on pip >=26.2). One value per
# workflow file; scripts/dev/check_pip_pin_drift.py fails the build if any
# workflow's PIP_PIN_VERSION diverges from the canonical pin.
env:
  PIP_PIN_VERSION: "26.2.1"

concurrency:
  group: harness-convention-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-convention-drift-check:
    name: Harness convention drift check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.10'

      - name: Install editable package
        run: |
          python -m pip install "pip==${PIP_PIN_VERSION}"
          python -m pip install -e ".[dev]"

      - name: Run harness-convention freshness check
        id: drift
        run: |
          python scripts/dev/validate_harness_convention_pins.py \
            --harnesses-root src/apothem/harnesses \
            --output drift-report.json
        continue-on-error: true

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: harness-convention-drift-report
          path: drift-report.json
          if-no-files-found: warn
          retention-days: 90

      - name: File drift-alert issue
        if: steps.drift.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const today = new Date().toISOString().slice(0, 10);
            let body;
            try {
              const report = JSON.parse(fs.readFileSync('drift-report.json', 'utf8'));
              const drifted = (report.drifted_harnesses || []).map(h => `- \`${h.harness}\` - ${h.reason} (snapshot: \`${h.snapshot_date || 'n/a'}\`, age days: \`${h.age_days ?? 'n/a'}\`)`).join('\n');
              body = [
                `Harness-convention pin drift detected on ${today}.`,
                '',
                'Drifted harnesses:',
                drifted || '_(report parsed but no per-harness rows; inspect artifact)_',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Source of truth: `src/apothem/harnesses/*/STANDARD-CONVENTION-PIN.md`.',
                'The 90-day freshness cadence requires refreshing stale harness convention pins before release.',
              ].join('\n');
            } catch (e) {
              body = `Harness-convention pin validation exited non-zero on ${today}, but \`drift-report.json\` could not be parsed: ${e.message}. Inspect the workflow artifact.`;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[harness-convention-monitor] pin drift detected on ${today}`,
              body,
              labels: ['harness-convention-drift', 'automation'],
            });

      - name: Fail job if drift detected
        if: steps.drift.outcome == 'failure'
        run: |
          echo "Harness-convention pin drift detected; issue filed. Failing the job to surface in the Actions tab."
          exit 1
