# SPDX-License-Identifier: MIT

# Harness-convention freshness monitor.
#
# Enforces the 90-day freshness cadence on each harness adapter's
# STANDARD-CONVENTION-PIN.md. The monitor reads the adapter-local pin
# files, validates snapshot dates, and reports a drift alert when any pin is
# missing, malformed, future-dated, or stale. A second job fetches every
# vendor URL the pins and harness templates cite and reports any that has
# moved or died. A host whose name resolves only to an address no server can
# hold, such as 0.0.0.1, gets no request: the run flags it with a warning,
# and the issue lists its URLs to check by hand. A third check reads each
# harness's release channels from scripts/dev/vendor-release-channels.json,
# asks npm, GitHub or PyPI for each channel's current version, and asks each
# installer address where it redirects. It reports a new major line, a
# release past a trigger the file names, an installer that redirects
# somewhere new, or a channel that no longer exists. It sends the workflow's
# GITHUB_TOKEN to the GitHub API from a job that can only read; a separate
# job holds issues: write and files the issue. Each check keeps one open
# issue: a later finding is added to it as a comment rather than filed as a
# new issue.
#
# Schedule: weekly, 06:17 UTC on Mondays, so a pin is caught within a week
# of crossing the 90-day line, a moved vendor page within a week of the
# move, and a vendor's new major release within a week of its release.
# Manual fire via workflow_dispatch.
#
# SHA-pinning policy mirrors sibling workflows; every `uses:` reference
# is pinned by 40-char commit SHA followed by a `# vX.Y.Z` version
# comment. Dependabot proposes the bumps.

name: Harness Convention Monitor

on:
  schedule:
    - cron: '17 6 * * 1'   # 06:17 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-convention-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-convention-drift-check:
    name: Harness convention drift check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.10'

      - name: Install editable package
        run: |
          # Hash-locked pip; see scripts/ci/requirements-ci-pip.txt.
          python -m pip install --require-hashes -r scripts/ci/requirements-ci-pip.txt
          # Hash-locked dependencies; the package installs editable without resolving.
          python -m pip install --require-hashes -r scripts/ci/requirements-ci-dev.txt
          python -m pip install --no-deps -e .

      - name: Run harness-convention freshness check
        id: drift
        run: |
          python scripts/dev/validate_harness_convention_pins.py \
            --harnesses-root src/apothem/harnesses \
            --output drift-report.json
        continue-on-error: true

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: harness-convention-drift-report
          path: drift-report.json
          if-no-files-found: warn
          retention-days: 90

      - name: File drift-alert issue
        if: steps.drift.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const today = new Date().toISOString().slice(0, 10);
            let body;
            try {
              const report = JSON.parse(fs.readFileSync('drift-report.json', 'utf8'));
              const drifted = (report.drifted_harnesses || []).map(h => `- \`${h.harness}\` - ${h.reason} (snapshot: \`${h.snapshot_date || 'n/a'}\`, age days: \`${h.age_days ?? 'n/a'}\`)`).join('\n');
              body = [
                `Harness-convention pin drift detected on ${today}.`,
                '',
                'Drifted harnesses:',
                drifted || '_(report parsed but no per-harness rows; inspect artifact)_',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Source of truth: `src/apothem/harnesses/*/STANDARD-CONVENTION-PIN.md`.',
                'The 90-day freshness cadence requires refreshing stale harness convention pins before release.',
              ].join('\n');
            } catch (e) {
              body = `Harness-convention pin validation exited non-zero on ${today}, but \`drift-report.json\` could not be parsed: ${e.message}. Inspect the workflow artifact.`;
            }
            // One open issue per check: comment on it when it exists.
            const title = '[harness-convention-monitor] pin drift detected';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'harness-convention-drift',
              per_page: 100,
            });
            const existing = open.find(i => !i.pull_request && i.title.startsWith(title));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['harness-convention-drift', 'automation'],
              });
            }

      - name: Fail job if drift detected
        if: steps.drift.outcome == 'failure'
        run: |
          echo "Harness-convention pin drift detected; issue filed or updated. Failing the job to surface in the Actions tab."
          exit 1

  vendor-url-check:
    name: Vendor URL check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.10'

      # Standard library only, so no package install is needed.
      - name: Check vendor URLs in pins and templates
        id: urls
        run: |
          python scripts/dev/check_vendor_urls.py \
            --harnesses-root src/apothem/harnesses \
            --output vendor-url-report.json
        continue-on-error: true

      - name: Upload vendor URL report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vendor-url-report
          path: vendor-url-report.json
          if-no-files-found: warn
          retention-days: 90

      # A host that got no request is a gap in every run, including one that
      # files no issue, so the run itself carries a warning for it.
      - name: Flag hosts the check sent no request to
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('vendor-url-report.json', 'utf8'));
            } catch (e) {
              return;  // The upload step already warns when the report is missing.
            }
            const unchecked = new Map();
            for (const u of (report.urls || []).filter(u => u.outcome === 'unroutable')) {
              const reason = u.error || 'a host resolves to no usable address';
              unchecked.set(reason, (unchecked.get(reason) || 0) + 1);
            }
            for (const [reason, count] of unchecked) {
              core.warning(`Not checked: ${reason}, so no request was sent for ${count} cited URLs. Check them by hand.`);
            }

      - name: File vendor-URL issue
        if: steps.urls.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const today = new Date().toISOString().slice(0, 10);
            let body;
            try {
              const report = JSON.parse(fs.readFileSync('vendor-url-report.json', 'utf8'));
              const rows = (report.urls || [])
                .filter(u => u.outcome === 'moved' || u.outcome === 'dead')
                .map(u => {
                  const target = u.final_url && u.final_url !== u.url ? ` -> ${u.final_url}` : '';
                  const cited = (u.cited_in || []).map(p => `\`${p}\``).join(', ');
                  return `- ${u.outcome}: ${u.url}${target} (status \`${u.status ?? 'n/a'}\`; cited in ${cited})`;
                })
                .join('\n');
              const unreachable = (report.counts && report.counts.unreachable) || 0;
              // Group the URLs that got no request under the reason, which
              // names the host and the address it resolves to.
              const unchecked = new Map();
              for (const u of (report.urls || []).filter(u => u.outcome === 'unroutable')) {
                const reason = u.error || 'a host resolves to no usable address';
                unchecked.set(reason, [...(unchecked.get(reason) || []), u.url]);
              }
              const uncheckedRows = [...unchecked]
                .map(([reason, urls]) => [`- ${reason}:`, ...urls.map(url => `  - ${url}`)].join('\n'))
                .join('\n');
              body = [
                `Moved or dead vendor URLs found on ${today}.`,
                '',
                rows || '_(report parsed but no moved or dead rows; inspect artifact)_',
                '',
                `Unreachable this run, not counted as moved or dead: ${unreachable}.`,
                ...(uncheckedRows ? [
                  '',
                  'Not checked, because the host name resolves only to an address no server can hold, so no request was sent. Check these pages by hand:',
                  uncheckedRows,
                ] : []),
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Update each pin or template to cite the current page, and refresh the pin retrieval date.',
              ].join('\n');
            } catch (e) {
              body = `The vendor URL check exited non-zero on ${today}, but \`vendor-url-report.json\` could not be parsed: ${e.message}. Inspect the workflow artifact.`;
            }
            // One open issue per check: comment on it when it exists.
            const title = '[harness-convention-monitor] vendor URLs moved or dead';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'harness-convention-drift',
              per_page: 100,
            });
            const existing = open.find(i => !i.pull_request && i.title.startsWith(title));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['harness-convention-drift', 'automation'],
              });
            }

      - name: Fail job if a vendor URL moved or died
        if: steps.urls.outcome == 'failure'
        run: |
          echo "Moved or dead vendor URLs found; issue filed or updated. Failing the job to surface in the Actions tab."
          exit 1

  vendor-release-check:
    name: Vendor release check
    runs-on: ubuntu-latest
    # Each attempt at a request has 30 seconds in all, however many addresses
    # the host resolves to and however slowly it answers, so a channel that
    # gets no answer takes at most 93 seconds (three attempts and 3 seconds of
    # backoff). The check asks no further channel after 20 minutes, so it
    # writes its report within 22 minutes, however many channels the file
    # lists. tests/scripts/test_check_vendor_releases.py fails when that bound
    # and five minutes for the other steps no longer fit.
    timeout-minutes: 30
    # Read only: the check sends this job's GITHUB_TOKEN to the GitHub API, so
    # the token holds no write scope. vendor-release-issue files the issue.
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.releases.outcome }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.10'

      # Standard library only, so no package install is needed.
      - name: Check vendor release channels
        id: releases
        env:
          # Raises the GitHub API rate limit; the script sends it to
          # api.github.com only.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/dev/check_vendor_releases.py \
            --output vendor-release-report.json
        continue-on-error: true

      - name: Upload vendor release report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vendor-release-report
          path: vendor-release-report.json
          if-no-files-found: warn
          retention-days: 90

      # Every run lists each channel in its summary and warns about a channel
      # it could not read, including a run that files no issue.
      - name: Summarize release channels
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('vendor-release-report.json', 'utf8'));
            } catch (e) {
              return;  // The upload step already warns when the report is missing.
            }
            // Report values come from registries, installer addresses and the
            // channel file. Each is shown on one line, cut to 200 characters,
            // and in the summary as HTML-escaped code, so it adds no markup.
            const text = value => {
              const line = String(value ?? 'n/a').replace(/\s+/g, ' ');
              return line.length > 200 ? `${line.slice(0, 197)}...` : line;
            };
            const code = value => `<code>${text(value)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#39;')}</code>`;
            const problems = report.problems || [];
            for (const p of problems) {
              core.warning(`The check could not run: ${text(p)}`);
            }
            const channels = report.channels || [];
            for (const c of channels.filter(c => c.outcome === 'unreachable')) {
              core.warning(`Not checked: ${text(c.harness)} ${text(c.channel)}: ${text(c.detail)}.`);
            }
            const header = ['Harness', 'Channel', 'Reviewed', 'Current', 'Outcome']
              .map(data => ({data, header: true}));
            const rows = channels.map(c => [
              code(c.harness),
              code(c.channel),
              `${code(c.reviewed)} (${code(c.reviewed_on)})`,
              code(c.current),
              code(c.outcome),
            ]);
            const unwatched = (report.not_watched || []).map(n => code(n.harness)).join(', ');
            const summary = core.summary.addHeading('Vendor release channels', 2);
            if (problems.length) {
              summary.addRaw('<p>The check could not run:</p>').addList(problems.map(code));
            }
            await summary
              .addTable([header, ...rows])
              .addRaw(`Not watched: ${unwatched || 'none'}.`)
              .write();

  vendor-release-issue:
    name: File vendor release issue
    needs: vendor-release-check
    if: needs.vendor-release-check.outputs.outcome == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No checkout, and downloading this run's own artifact needs no token
    # scope, so the job holds issues: write alone.
    permissions:
      issues: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      # A run whose check wrote no report still files an issue saying so.
      - name: Download vendor release report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: vendor-release-report
        continue-on-error: true

      - name: File vendor-release issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const today = new Date().toISOString().slice(0, 10);
            // Report values come from registries, installer addresses and the
            // channel file. Each is put on one line, cut to 200 characters,
            // and shown as a code span whose backtick fence is longer than any
            // run of backticks inside it, so Markdown, HTML and @mentions in
            // it do nothing.
            const code = value => {
              let line = String(value ?? 'n/a').replace(/\s+/g, ' ').trim() || 'n/a';
              if (line.length > 200) line = `${line.slice(0, 197)}...`;
              const longest = Math.max(0, ...(line.match(/`+/g) || []).map(run => run.length));
              const fence = '`'.repeat(longest + 1);
              const pad = line.startsWith('`') || line.endsWith('`') ? ' ' : '';
              return `${fence}${pad}${line}${pad}${fence}`;
            };
            const stepLog = 'Exit 1 means the channel file or a pin\'s evidence phrase is wrong, or the check stopped on an error; the Check vendor release channels step log in the run below has the details.';
            const run = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            try {
              const report = JSON.parse(fs.readFileSync('vendor-release-report.json', 'utf8'));
              const problems = report.problems || [];
              const channels = report.channels || [];
              const line = c => `- ${code(c.outcome)}: ${code(c.harness)} ${code(c.channel)}: ${code(c.detail)} (reviewed ${code(c.reviewed)} on ${code(c.reviewed_on)})`;
              const failing = channels.filter(c => c.outcome === 'drift' || c.outcome === 'missing');
              // A trigger's action is prose from the channel file in this
              // repository, so it is shown as written.
              const triggers = failing
                .filter(c => c.trigger)
                .map(c => `- ${code(c.harness)} ${code(c.channel)}: ${String(c.trigger).replace(/\s+/g, ' ')}`);
              const differing = channels.filter(c => c.outcome === 'info').map(line);
              const unreachable = (report.counts && report.counts.unreachable) || 0;
              if (problems.length) {
                body = [
                  `The vendor release check could not run on ${today}:`,
                  '',
                  ...problems.map(p => `- ${code(p)}`),
                  '',
                  stepLog,
                  '',
                  run,
                ].join('\n');
              } else {
                body = [
                  `Vendor release drift found on ${today}.`,
                  '',
                  failing.map(line).join('\n') || '_(report parsed but no drift or missing rows; inspect artifact)_',
                  ...(triggers.length ? ['', 'Triggers to act on:', ...triggers] : []),
                  ...(differing.length ? ['', 'Other releases that differ from the reviewed version, reported without failing:', ...differing] : []),
                  '',
                  `Unreachable this run, not counted as drift: ${unreachable}.`,
                  '',
                  run,
                  '',
                  'Re-check each named pin against the new release or redirect target, then update the channel\'s `reviewed`, `reviewed_on` and `reviewed_from` in `scripts/dev/vendor-release-channels.json`. A trigger on a version channel fails the check every week until you remove or change it. A trigger on an installer address stops once `reviewed` records the new target, so record that target only after the trigger\'s action is done.',
                ].join('\n');
              }
            } catch (e) {
              body = [
                `The vendor release check exited non-zero on ${today}, but \`vendor-release-report.json\` could not be read: ${code(e.message)}.`,
                '',
                stepLog,
                '',
                run,
              ].join('\n');
            }
            // One open issue per check: comment on it when it exists.
            const title = '[harness-convention-monitor] vendor release drift';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'harness-convention-drift',
              per_page: 100,
            });
            const existing = open.find(i => !i.pull_request && i.title.startsWith(title));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['harness-convention-drift', 'automation'],
              });
            }

      - name: Fail job if a release channel drifted
        run: |
          echo "Vendor release drift found; issue filed or updated. Failing the job to surface in the Actions tab."
          exit 1
