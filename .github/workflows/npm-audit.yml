# SPDX-License-Identifier: MIT

# Weekly npm dependency audit for the documentation site and the two tool
# lockfiles: the vsce packager (tools/vsce) and the harness CLIs the channel
# smoke installs (tools/channel-smoke). A pull request that changes a tool
# lockfile, such as a Dependabot update, is also checked here, because a
# lockfile-only pull request runs no ci.yml job: tools/ is outside ci.yml's
# gated paths. For each tool lockfile the workflow audits it and installs it
# from the lockfile. For tools/vsce it also packages the VS Code extension the
# way release.yml does. The tool-lockfile-tests job runs the vsce release tests
# (tests/scripts/test_release_vsix.py) and the lockfile-location test
# (tests/scripts/test_tool_lockfile_locations.py) on every trigger of this
# workflow, so the weekly run also surfaces drift between those tests and the
# workflows. A tools/channel-smoke pull request also runs channel-smoke.yml.
#
# Sibling of pip-audit.yml, which covers the Python surface only: its triggers
# are scoped to pyproject.toml, requirements*.txt and src/apothem/_vendor/**.
# That scoping is what let the site's npm tree go unaudited — pip-audit
# reported success on what it did check and said nothing about the ecosystem it
# did not, so a green audit badge coexisted with four high-severity advisories
# in shipped site dependencies. OpenSSF Scorecard's Vulnerabilities check reads
# OSV across every ecosystem, which is why it scored 0 while pip-audit passed.
#
# The weekly cron matters as much as the per-PR run: an advisory disclosed
# against an already-resolved dependency changes nothing in the diff, so only a
# time-triggered scan surfaces it.

name: NPM Audit (Weekly)

on:
  schedule:
    - cron: "0 4 * * 1"   # every Monday 04:00 UTC, an hour after pip-audit
  push:
    branches: [main]
    paths:
      - "site/package.json"
      - "site/package-lock.json"
      - "tools/vsce/**"
      - "tools/channel-smoke/**"
      - ".github/workflows/npm-audit.yml"
  pull_request:
    paths:
      - "site/package.json"
      - "site/package-lock.json"
      - "tools/vsce/**"
      - "tools/channel-smoke/**"
      - ".github/workflows/npm-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-audit-${{ github.ref }}
  cancel-in-progress: true  # scan-class cadence: cancel stale runs on rebase

jobs:
  audit:
    name: npm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Run npm audit
        working-directory: site
        # --audit-level=high fails the run on high and critical only. Moderate
        # and low findings still print, so they are visible without gating the
        # build on advisories that are routinely unactionable in a static-site
        # dependency tree. npm audit reads the committed lockfile, so no install
        # is needed and none is run — nothing executes package install scripts.
        run: npm audit --audit-level=high

  tool-lockfiles:
    name: npm-audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dir: [tools/vsce, tools/channel-smoke]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          # No dependency cache: these lockfiles feed publishing and smoke
          # jobs, which install without a cache too.
          package-manager-cache: false
      - name: Run npm audit
        working-directory: ${{ matrix.dir }}
        run: npm audit --audit-level=high
      - name: Install from the lockfile
        # The same install the release, publish and channel-smoke jobs run;
        # --ignore-scripts runs no dependency install script.
        working-directory: ${{ matrix.dir }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package the VS Code extension
        # The command release.yml's vsix job runs: it loads the locked vsce and
        # packages vscode-extension/ with it, so a vsce bump that cannot package
        # fails here instead of at the release.
        if: matrix.dir == 'tools/vsce'
        working-directory: vscode-extension
        run: ../tools/vsce/node_modules/.bin/vsce package --no-dependencies --out "${RUNNER_TEMP}/apothem.vsix"

  tool-lockfile-tests:
    name: tool lockfile tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up Node
        # An explicit Node, so the Trusted Publishing guard test runs on the
        # Node the vsce jobs use, not the runner's preinstalled one.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        shell: bash
        run: |
          # Hash-locked pip; see scripts/ci/requirements-ci-pip.txt.
          python -m pip install --require-hashes -r scripts/ci/requirements-ci-pip.txt
          python -m pip install -e ".[dev]"
      - name: Run the tool lockfile tests
        # The vsce release tests (hash pins, engines against the Node the vsce
        # jobs set up, the Trusted Publishing guard) and the lockfile-location
        # test: ci.yml does not run them for a pull request that changes only
        # tools/.
        run: python -m pytest -q -p no:cacheprovider tests/scripts/test_tool_lockfile_locations.py tests/scripts/test_release_vsix.py
