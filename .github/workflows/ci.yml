# SPDX-License-Identifier: MIT

# Continuous Integration workflow.
#
# Twelve canonical check classes run on every push to main and every pull request:
#   1. lint               — ruff check
#   2. format-check       — ruff format --check
#   3. type-check         — mypy
#   4. test               — pytest across an OS x Python matrix
#   5. coverage           — pytest-cov in two parallel shards, combined into one
#                           report with HTML + XML artifacts
#   6. security-scan      — bandit static analysis (CodeQL owned by codeql.yml)
#   7. supply-chain-scan  — Trivy filesystem scan (deps + IaC) + pip-audit
#   8. docs-build         — Next.js + Fumadocs build
#   9. example-run        — smoke test for each examples/* artifact-class demo
#  10. release-preflight  — semantic-version tag dry-run + CHANGELOG sanity
#  11. metrics            — per-package coverage floors + the metrics.json artifact
#  12. home-isolation     — the whole test suite with the home and the XDG base
#                           directories on empty folders; fails if anything
#                           appears in them. Not a required check.
#
# SHA-pinning policy
# ------------------
# Every action `uses:` reference is pinned by 40-character commit SHA followed
# by a `# vMAJOR.MINOR.PATCH` version comment. Dependabot (see
# .github/dependabot.yml) proposes SHA bumps weekly; a proposal
# lands only when a maintainer merges it, so pins are also reviewed and
# bumped manually during hardening passes. One documented exception
# remains (release.yml): the SLSA reusable generator is trust-anchored on
# its per-tag attestation (Sigstore policy forbids SHA-pinning of trusted
# reusable workflows). That `uses:` line carries an
# `action-pinning-exempt:` marker for auditability.
#
# Permissions policy
# ------------------
# The workflow-level permissions block grants the minimum scopes the steps
# below need (read-only on contents). Exactly one job escalates:
# supply-chain-scan takes security-events:write so the Trivy SARIF can be
# posted to Code Scanning. The Trivy scan and its upload run only while the
# repository is public, because Code Scanning on a private repository needs
# GitHub Code Security. CodeQL itself is owned by codeql.yml and carries
# its own scopes there. Coverage data and reports are uploaded as workflow
# artifacts rather than to an external service, so the coverage jobs need no
# write scope at all. No job uses write-all.

name: CI

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'CHANGELOG.md'
      - 'plugins/**'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'site/**'
      - 'examples/**'
      - 'scripts/**'
      - 'evals/**'
      - '.github/workflows/**'
      - '.pre-commit-config.yaml'
      - '.gitleaks.toml'
  pull_request:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'CHANGELOG.md'
      - 'plugins/**'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'site/**'
      - 'examples/**'
      - 'scripts/**'
      - 'evals/**'
      - '.github/workflows/**'
      - '.pre-commit-config.yaml'
      - '.gitleaks.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # 1, 2, 3, 4 — lint, format-check, type-check, test
  quality:
    name: quality / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # The Windows cells run the full suite in 64 to 88 minutes (November
    # 2026), and the 90-minute limit cancelled cells whose tests had passed,
    # so they get 120, the workflow-concurrency validator's Windows ceiling.
    # The Linux cells finish in under 10 minutes and keep 90, the validator's
    # matrix-job ceiling, which still stops a hung run. ci-matrix.yml gives
    # its Windows cells the same limit.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 120 || 90 }}
    # A pre-release cell is advisory: it exercises the next Python against the
    # suite for early-warning without gating the merge. matrix.include carries
    # `prerelease: true` on the 3.15 cell only; the job's continue-on-error and
    # setup-python's allow-prereleases key off it. Every stable cell keeps
    # prerelease unset (false-y) and stays a hard gate.
    continue-on-error: ${{ matrix.prerelease || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.15"
            prerelease: true
    steps:
      - name: Harden runner
        # harden-runner supports only Ubuntu runners; guard it so the step is
        # skipped (not a silent no-op) on the windows-latest cells and the
        # "Harden runner" name does not overstate coverage. Matches
        # clean-install-gate.yml. Non-Linux cells run unhardened by platform
        # limitation.
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.prerelease || false }}
          cache: pip
          cache-dependency-path: scripts/ci/requirements-ci-dev.txt
      - name: Install dependencies
        # Force bash on every matrix OS. The windows-latest cell defaults to
        # pwsh, which keeps going after a failed native command, so a failed
        # hash check on the pip line would not stop the step. Bash runs with
        # -e and fails it.
        shell: bash
        run: |
          # Hash-locked pip; see scripts/ci/requirements-ci-pip.txt.
          python -m pip install --require-hashes -r scripts/ci/requirements-ci-pip.txt
          # Hash-locked dependencies (runtime + dev extra, as of the lock date in
          # the file); the package itself installs editable without resolving.
          python -m pip install --require-hashes -r scripts/ci/requirements-ci-dev.txt
          python -m pip install --no-deps -e .
      - name: Ruff (lint)
        run: python -m ruff check .
      - name: Ruff (complexity, CLI and install driver)
        # The CLI command bodies and the shared install driver hold the
        # tighter cyclomatic-complexity bound of 15; the repo-wide bound in
        # pyproject.toml ([tool.ruff.lint.mccabe]) is a ratchet that only
        # keeps the rest of the tree from getting worse.
        run: >-
          python -m ruff check --select C901
          --config "lint.mccabe.max-complexity=15"
          src/apothem/cli src/apothem/harnesses/_shared
      - name: Ruff (format check)
        run: python -m ruff format --check .
      - name: Check no released CHANGELOG section changed
        # A release renames [Unreleased] to [x.y.z]. A branch cut before the
        # release can then merge the release in with no conflict and leave
        # its entry inside the released section; after v1.6.0 five open pull
        # requests would have edited the 1.6.0 notes this way. A pull request
        # is compared with HEAD^1, the base branch commit GitHub merged it
        # into; a push to main with the tip before the push, so every pushed
        # commit is covered. It runs in one required cell so a finding blocks
        # the merge. A 'Changelog-Released-Edit: <version> <reason>' commit
        # trailer allows a deliberate edit of that version's notes.
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch --quiet --no-tags --unshallow origin
          base=HEAD^1
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE" ] \
            && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base=$BEFORE
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::notice::$base is not in the clone (a force push?); comparing with HEAD^1"
            base=HEAD^1
          fi
          python scripts/dev/check_changelog_released_sections.py --base "$base"
      - name: Mypy (type check)
        run: python -m mypy
      - name: Start node once
        # A fresh Windows runner's first node launch can take more than a
        # minute while pytest's workers keep the machine busy. Inside pytest
        # it stalled the vsce version-guard test's 60-second node probe in 11
        # Windows jobs from 2026-10-29 to 2026-11-03, each time on the run's
        # first node launch. Launching node here, before pytest starts, moves
        # that cold start ahead of the timed tests. `node -e 0` runs the
        # engine start-up the tests' `node -e` launches need; `node --version`
        # returns before most of it.
        timeout-minutes: 5
        shell: bash
        run: |
          if command -v node >/dev/null; then
            time node -e 0
          fi
      - name: Pytest
        run: python -m pytest --color=yes
      - name: Ecosystem validator
        run: python scripts/dev/validate_ecosystem.py --content-root src/apothem
      - name: Conformity validators (corpus mode)
        shell: pwsh
        run: |
          # --strict is load-bearing: without it the gate is advisory and
          # exits zero even on blocking findings, so every branch below is
          # unreachable. The advisory default serves operator ad-hoc runs;
          # CI is the enforcement layer.
          python -m apothem.conformity.gate --all . --strict
          if ($LASTEXITCODE -eq 0) {
            exit 0
          }

          $allExitCode = $LASTEXITCODE
          $subject = git log -1 --pretty=%s
          if ($subject -notlike "feat: release apothem *") {
            exit $allExitCode
          }

          Write-Host "Release root commit: rerunning all standalone validators except conventional-commit-grep."
          $payload = python -m apothem.conformity.gate --list
          $validators = ($payload | ConvertFrom-Json).standalone_validators |
            Where-Object { $_ -ne "conventional-commit-grep" }

          foreach ($validator in $validators) {
            $script = "src/apothem/conformity/$($validator.Replace('-', '_')).py"
            python $script .
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
      - name: Chaos sweep
        run: python scripts/dev/chaos_pass.py --content-root src/apothem

  # 5 — coverage, in two shards
  #
  # The whole suite under coverage took 14 to 30 minutes on one runner
  # (November 2026), and the 30-minute limit, the workflow-concurrency
  # validator's ceiling for a job without a matrix, cancelled some runs. So
  # the suite runs in two shards in parallel, each on its own runner with half
  # the tests, and the `coverage` job combines what they measured.
  coverage-shard:
    name: coverage shard ${{ matrix.shard }} of 2
    runs-on: ubuntu-latest
    # Each shard runs about half the suite. The validator's ceiling for a
    # matrix job is 90; 30 keeps a hung shard from holding the check longer.
    timeout-minutes: 30
    needs: [quality]
    permissions:
      contents: read
    strategy:
      # Let the other shard finish, so one run shows every failing test.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ci/requirements-ci-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r scripts/ci/requirements-ci-pip.txt
          python -m pip install --require-hashes -r scripts/ci/requirements-ci-dev.txt
          python -m pip install --no-deps -e .
      - name: Pytest with coverage
        # --shard=K/2 (tests/conftest.py) keeps the tests whose node id hashes
        # to this shard, so the two shards run every test exactly once. It
        # needs the "=": pytest reads its command line before it loads
        # tests/conftest.py, which adds the option. --cov=src/apothem measures
        # the whole package: the coverage job reports the engine files from
        # it, and the metrics job reads the conformity and audit figures from
        # the same data, so the suite runs under coverage once per CI run.
        # --cov-report= writes no report, and --cov-fail-under=0 turns off
        # pytest-cov's check of [tool.coverage.report] fail_under = 80 on half
        # the suite; the coverage job checks the combined figure. pytest-cov
        # leaves the data in .coverage, renamed so the two shards' files can
        # sit side by side.
        run: |
          python -m pytest --shard=${{ matrix.shard }}/2 --cov=src/apothem --cov-report= --cov-fail-under=0
          mv .coverage .coverage.shard-${{ matrix.shard }}
      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-data-${{ matrix.shard }}
          path: .coverage.shard-${{ matrix.shard }}
          # upload-artifact leaves out files whose names start with a dot
          # unless this is set.
          include-hidden-files: true
          if-no-files-found: error
          # Kept 7 days, so a failed shard can be re-run later and still use
          # the other shard's data. After 7 days, re-run all jobs.
          retention-days: 7

  # The required check. It keeps the name `coverage` that branch protection
  # requires and ci-docs-stub.yml reports on a documentation-only pull request.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # GitHub skips a job when a job it needs failed or was cancelled, and a
    # skipped required check counts as passed. always() runs this job anyway,
    # and the step after Harden runner fails it unless both shards passed.
    # always() also starts this job, which then fails, on a run that is
    # cancelled or superseded by a newer push (the concurrency group at the
    # top of this file cancels a run in progress). That costs one short job.
    # It is kept because this job must never end as skipped.
    if: always()
    timeout-minutes: 15
    needs: [coverage-shard]
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - name: Require both shards to pass
        # The result is "success" only when both shards passed. "failure",
        # "cancelled" (a shard ran past its time limit, or the run was
        # cancelled) and "skipped" (the quality job did not pass, so no shard
        # ran) all fail this check.
        env:
          SHARD_RESULT: ${{ needs.coverage-shard.result }}
        run: |
          if [ "${SHARD_RESULT}" != "success" ]; then
            echo "::error title=coverage::The coverage shards did not both pass (result: ${SHARD_RESULT})."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ci/requirements-ci-dev.txt
      - name: Install dependencies
        # coverage comes from the dev lock. Nothing here imports the package,
        # so it is not installed.
        run: |
          python -m pip install --require-hashes -r scripts/ci/requirements-ci-pip.txt
          python -m pip install --require-hashes -r scripts/ci/requirements-ci-dev.txt
      - name: Download the shards' coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true
          # A folder of its own keeps the artifacts' files apart from the
          # checked-out code the next steps run.
          path: coverage-data
      - name: Combine and report coverage
        # The data names files by absolute path, and every ubuntu runner checks
        # out to the same path, so the shards' files and this checkout match.
        # combine names each shard's file, so a missing file fails this step
        # ("Couldn't combine from non-existent path") instead of measuring half
        # the suite, which can still clear the 80% floor (main's engine total
        # is about 93%). The shards measure all of src/apothem, so every report
        # here keeps only the engine: the folders in [tool.coverage.run]
        # source, read from pyproject.toml so the list lives in one place.
        # coverage report enforces [tool.coverage.report] fail_under = 80 on
        # that engine figure; show_missing lists the lines no test ran.
        run: |
          python -m coverage combine coverage-data/.coverage.shard-1 coverage-data/.coverage.shard-2
          engine="$(python -c 'import tomllib; source = tomllib.load(open("pyproject.toml", "rb"))["tool"]["coverage"]["run"]["source"]; print(",".join(f"{path}/*" for path in source))')"
          python -m coverage report --include="${engine}"
          python -m coverage xml --include="${engine}" -o coverage.xml
          python -m coverage html --include="${engine}" -d coverage-html
      - name: Upload coverage XML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30
      - name: Upload coverage HTML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 30

  # 6 — security-scan (bandit; CodeQL owned by codeql.yml to avoid SARIF collision)
  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # CodeQL (Python) is owned solely by codeql.yml — which scans the full
      # src/** tree plus the actions language — so this job runs only bandit.
      # Running CodeQL here too collided on the /language:python SARIF
      # category (GitHub keeps one analysis, silently dropping the other).
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install bandit
        # bandit and its dependencies, hash-locked in
        # scripts/ci/requirements-ci-bandit.txt (spec in scripts/dev/ci_lock_table.py).
        run: python -m pip install --require-hashes -r scripts/ci/requirements-ci-bandit.txt
      - name: Bandit static analysis
        run: python -m bandit -c pyproject.toml -r src/apothem scripts

  # 7 — supply-chain-scan (Trivy + pip-audit + gitleaks)
  supply-chain-scan:
    name: supply-chain-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # gitleaks scans the full history of HEAD
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Trivy filesystem scan
        # Public repositories only. The scan's one output is the SARIF file
        # the next step uploads, and Code Scanning on a private repository
        # needs GitHub Code Security, so a private run would discard it.
        # pip-audit and gitleaks below run in both states.
        if: github.event.repository.private == false
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload Trivy SARIF
        # Public-repository release posture: SARIF upload is part of the
        # supply-chain gate and fails the job if Code Scanning rejects it.
        # Skipped on fork pull requests: the GITHUB_TOKEN there is read-only,
        # so security-events:write is unavailable and the upload would always
        # fail — red-failing every external contributor's PR. The Trivy scan
        # itself still runs on forks; only the SARIF upload (which the fork
        # token cannot perform) is gated.
        # Skipped on a private repository, together with the scan above:
        # Code Scanning there needs GitHub Code Security, and without it the
        # upload fails the job.
        if: >-
          github.event.repository.private == false &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - name: Upgrade pip
        # Upgrade the runner-bundled pip from the hash-locked
        # scripts/ci/requirements-ci-pip.txt before pip-audit runs so the audit
        # scans against a current pip version (CVE-2026-13346 closes on pip
        # >=26.2; earlier pip mishandles doubly-encoded package URLs from
        # indexes). The fix-the-vuln approach is preferred over --ignore-vuln.
        run: python -m pip install --require-hashes -r scripts/ci/requirements-ci-pip.txt
      - name: pip-audit
        run: |
          # pip-audit and its dependencies, hash-locked in
          # scripts/ci/requirements-ci-pip-audit.txt. That lock leaves pip out, so
          # the pip installed above stays, and the audit below covers it and this
          # closure.
          python -m pip install --require-hashes -r scripts/ci/requirements-ci-pip-audit.txt
          # Use the CLI binary (the import name uses an underscore —
          # `python -m pip-audit` raises ModuleNotFoundError). `--desc`
          # surfaces advisory descriptions; `--strict` is intentionally
          # NOT set during 0.x so a transient transitive advisory does
          # not wedge the build before a remediation lands.
          pip-audit --desc
      - name: Gitleaks (secrets scan)
        # Self-contained CLI install instead of a wrapper Action so the
        # step does not depend on an upstream tag/SHA the wrapper repo
        # may move out from under us. The release-archive download URL
        # is pinned by version, and the binary is verified by sha256
        # before invocation.
        run: |
          set -euo pipefail
          # Lockstep: keep in sync with the gitleaks rev in .pre-commit-config.yaml.
          GL_VERSION="8.30.1"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}"
          GL_ARCHIVE="gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl --retry 5 --retry-delay 2 --retry-all-errors -sSfL "${BASE_URL}/${GL_ARCHIVE}" -o "/tmp/${GL_ARCHIVE}"
          curl --retry 5 --retry-delay 2 --retry-all-errors -sSfL "${BASE_URL}/gitleaks_${GL_VERSION}_checksums.txt" -o /tmp/gitleaks-checksums.txt
          grep "${GL_ARCHIVE}" /tmp/gitleaks-checksums.txt > /tmp/gitleaks-checksum.txt
          (cd /tmp && sha256sum -c /tmp/gitleaks-checksum.txt)
          tar -xzf "/tmp/${GL_ARCHIVE}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
          # Config auto-discovered: the canonical `.gitleaks.toml` lives at
          # the repo root, resolved identically by this job and the
          # pre-commit `gitleaks` hook.
          # Scan the history of the commit under test only. gitleaks reads
          # `git log --all` by default, and the full-depth checkout fetches
          # every branch, so without this one open pull request's commit
          # fails every other pull request's run, checked against a
          # `.gitleaks.toml` that is not that commit's own. Each branch's
          # commits are still scanned in that branch's own run, and every
          # push to main scans all of main.
          gitleaks detect --source . --no-banner --redact --log-opts="--full-history HEAD"

  # 8 — docs-build
  docs-build:
    name: docs-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install docs dependencies
        working-directory: site
        run: npm ci
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install reference-emitter runtime dependencies
        # npm run build runs the source reference emitter, which introspects the
        # live Click tree; the non-vendored runtime deps (click, rich) must import.
        # Hash-locked: scripts/ci/requirements-ci-runtime.txt.
        run: python -m pip install --require-hashes -r scripts/ci/requirements-ci-runtime.txt
      - name: Unit-test the site build helpers
        working-directory: site
        run: npm test
      - name: Check the sidebar order of every language
        # Each language's sidebar lists must follow the English page order;
        # author-ia.mjs --check fails when one drifts (a page missing from a
        # language's sidebar, or appended out of place).
        working-directory: site
        run: npm run ia:check
      - name: Build docs
        working-directory: site
        run: npm run build
      - name: Check the links in the built docs
        # A body link on a translated page is pointed at the language's own copy of
        # its target while the page renders, so only the built HTML shows it:
        # a link on a translated page opens the language's own page whenever the
        # site could use it, and every #fragment lands on an element id of the
        # page it opens. The
        # source-level guard (tests/unit/docs/test_site_anchor_links.py) runs in
        # the required quality job.
        run: python scripts/dev/check_built_docs_links.py site/dist
      - name: Upload docs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: docs-site
          path: site/dist/
          retention-days: 14

  # 9 — example-run
  example-run:
    name: example-run / ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example:
          - minimal-claude-md
          - minimal-skill
          - minimal-agent
          - minimal-command
          - minimal-hook
          - minimal-output-style
          - minimal-plan-pipeline
          - minimal-research-pipeline
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Smoke-test ${{ matrix.example }}
        run: |
          test -d "examples/${{ matrix.example }}"
          test -f "examples/${{ matrix.example }}/README.md"
          if [ -x "examples/${{ matrix.example }}/run.sh" ]; then
            bash "examples/${{ matrix.example }}/run.sh"
          else
            echo "No executable run.sh; presence-only smoke test passed."
          fi

  # 10 — release-preflight
  release-preflight:
    name: release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r scripts/ci/requirements-ci-pip.txt
          python -m pip install --require-hashes -r scripts/ci/requirements-ci-dev.txt
          python -m pip install --no-deps -e .
      - name: Check template digests against every release tag
        # An unedited copy of an earlier release's plain-text template is
        # removed on uninstall only while the manifest lists its digest. The
        # test job's checkout is shallow and has no tags, so only the pinned
        # latest release is checked there; this job has every tag, so it
        # verifies the pin against its tag and fails once a newer release
        # exists, which is the cue to refresh the pin in
        # tests/unit/test_template_digests.py.
        run: python -m pytest tests/unit/test_template_digests.py -n 0 -p no:cacheprovider
      - name: Check pip-pin single-source coherence
        # The pip pin (CVE-2026-13346) is single-sourced in the hash-locked
        # scripts/ci/requirements-ci-pip.txt; this gate fails if that file
        # drops below the floor or loses its hashes, or if a workflow installs
        # pip any other way.
        run: python scripts/dev/check_pip_pin_drift.py
      - name: Check site version parity
        # site/package.json's version is rendered in the landing footer and is
        # maintained by hand beside pyproject.toml's. Two hand-kept copies of
        # one number drift silently — nothing breaks, the site just advertises
        # a release that is no longer shipping.
        run: python scripts/dev/check_site_version_parity.py
      - name: Check CHANGELOG link definitions
        # Every "## [x.y.z]" heading needs a link definition naming tag vx.y.z,
        # and [Unreleased] must compare from the latest heading. Both are kept
        # by hand: after 1.1.0 the [1.1.0] link was never added and
        # [Unreleased] still compared from v1.0.2, so the docs site rendered a
        # literal "[1.1.0]" and readers diffed the wrong range.
        run: python scripts/dev/check_changelog_links.py
      - name: Check the plugin version changed with the plugin
        # A pinned plugin version keeps every Claude Code user on the cached
        # copy until the string changes. After v1.1.0 the package moved to
        # plugins/claude-code under the same 1.1.0, so earlier installs never
        # updated. This fails when the marketplace plugin differs from the last
        # release tag while its version is unchanged; the full-history checkout
        # above supplies the tags, and with no tag it skips and says so.
        # Between releases the plugin always differs from the last tag, so pull
        # requests get a warning annotation; the release build runs the same
        # check without --advisory and blocks a tag whose version was not bumped.
        run: python scripts/release/check_plugin_version_bump.py --advisory
      - name: Check per-folder README file coverage
        # A folder's README is its operating contract, so its file table is
        # load-bearing: a reader who cannot find a module there concludes it
        # does not exist. Nothing held that table against the folder's actual
        # contents, and the drift is invisible from both sides — you do not
        # notice a missing row while reading, or the README while adding a file.
        run: python scripts/dev/check_readme_file_coverage.py --strict
      - name: Check committed plugin tree matches the generator
        # plugins/claude-code/ is the Claude Code plugin package the marketplace
        # ships, assembled from src/apothem/ and committed so a git-source
        # marketplace resolves it from a clone. It is generated, so it drifts the
        # moment a command, agent, skill, or rule changes without a regen — and
        # the drift is silent: the marketplace still resolves, it just serves a
        # stale catalog. Cowork caps a plugin package at 5,000 files, which is
        # why the repository root cannot be the package and this tree exists.
        run: python scripts/dev/assemble_plugin_tree.py --check
      - name: Check the session-start skill index matches the catalog
        # hooks/messages/skill-index.md is generated from the skill and command
        # frontmatter. It drifts when a skill is added, renamed or switched
        # between model-invocable and manual without a regen, and then the
        # session-start index lists a stale catalog.
        run: python scripts/dev/generate_skill_index.py --check
      - name: Check harness convention pins are current
        # Each adapter's STANDARD-CONVENTION-PIN.md records what the vendor's
        # docs said on its snapshot date. A pin older than 90 days, one that
        # cites no absolute vendor URL, or one whose discovery target date has
        # passed fails here, so a stale pin blocks the merge instead of
        # waiting for the weekly monitor.
        run: python scripts/dev/validate_harness_convention_pins.py --harnesses-root src/apothem/harnesses
      # The PR title check (squash subject within 72 characters) runs in
      # pr-title.yml, which re-runs on a title edit.
      - name: Install release toolchain
        run: python -m pip install --require-hashes -r scripts/release/requirements-build-linux.txt
      - name: Build sdist + wheel
        # Same as the release build: the hash-locked toolchain, no isolated
        # fetch of the backend from PyPI.
        run: python -m build --no-isolation
      - name: Validate semantic version in pyproject and CHANGELOG entry
        run: |
          python -c "
          import re, sys, tomllib, pathlib
          cfg = tomllib.loads(open('pyproject.toml','rb').read().decode())
          proj = cfg['project']
          if 'version' in proj:
              v = proj['version']
          else:
              attr = cfg['tool']['setuptools']['dynamic']['version']['attr']
              parts = attr.split('.')
              init = pathlib.Path('src', *parts[:-1], '__init__.py')
              m = re.search(r'__version__\s*=\s*[\'\"]([^\'\"]+)[\'\"]', init.read_text(encoding='utf-8'))
              if not m:
                  sys.exit(f'cannot resolve dynamic version attr {attr!r} from {init}')
              v = m.group(1)
          if not re.match(r'^\d+\.\d+\.\d+(?:[-+].+)?$', v):
              sys.exit(f'pyproject.toml version {v!r} is not semver')
          changelog = open('CHANGELOG.md', encoding='utf-8').read()
          if not re.search(rf'^## \[{re.escape(v)}\]', changelog, re.MULTILINE):
              sys.exit(f'CHANGELOG.md is missing a [{v}] section header for the current pyproject version')
          print(f'pyproject.toml version OK: {v}; CHANGELOG carries the matching entry')
          "

  # 11 — metrics
  #
  # Reads the coverage the two coverage-shard jobs measured instead of running
  # the suite again, so it starts when both shards pass and takes about a
  # minute. It is not a required check: when a shard fails, GitHub skips it.
  metrics:
    name: metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [coverage-shard]
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ci/requirements-ci-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r scripts/ci/requirements-ci-pip.txt
          python -m pip install --require-hashes -r scripts/ci/requirements-ci-dev.txt
          python -m pip install --no-deps -e .
      - name: Download the shards' coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true
          # A folder of its own keeps the artifacts' files apart from the
          # checked-out code the next steps run.
          path: coverage-data
      - name: Combine coverage over every package
        # The shards measured src/apothem whole, so the engine, conformity and
        # audit figures come from the same tests. combine names each shard's
        # file, so a missing one fails this step instead of reporting half the
        # suite. coverage json takes no --include, so it covers every package.
        # --fail-under=0 turns off [tool.coverage.report] fail_under = 80,
        # which coverage json would otherwise check against the total over all
        # of src/apothem, a figure no project rule gates: the next step holds
        # the engine, conformity and audit each to its own floor. The package
        # stays installed because the next step installs Apothem for each
        # harness and times the CLI and the hooks.
        run: |
          python -m coverage combine coverage-data/.coverage.shard-1 coverage-data/.coverage.shard-2
          python -m coverage json --fail-under=0 -o coverage-all.json
      - name: Collect metrics and enforce package coverage floors
        # Floors: [tool.coverage.report] fail_under (engine) and
        # [tool.coverage.package-floors] (conformity, audit) in pyproject.toml.
        # Every other figure is recorded, not gated; a null names its reason.
        run: |
          python scripts/dev/collect_metrics.py \
            --coverage-json coverage-all.json \
            --check-floors \
            --out metrics.json
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: metrics
          path: |
            metrics.json
            coverage-all.json
          if-no-files-found: warn
          retention-days: 90

  # 12 — home-isolation
  home-isolation:
    # tests/conftest.py redirects the user home, the install ledger and backup
    # roots and the hook state folder, and clears CODEX_HOME and
    # CLAUDE_CONFIG_DIR, for the session and for every test. A write made
    # before those fixtures run (collection-time code, a plugin's session
    # fixture), or through a root they do not cover, still lands in the
    # developer's real home. Such a write can
    # start in any test subtree, so this job runs the whole suite, as the
    # quality job's Pytest step does, with the home and the four XDG base
    # directories on fresh empty folders: anything that appears in them is such
    # a write. It is not a required check.
    name: home-isolation
    runs-on: ubuntu-latest
    # The 20-minute limit cancelled this job on main and on pull requests
    # (November 2026), as the suite grew. 30 is the workflow-concurrency
    # validator's ceiling for a job without a matrix.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ci/requirements-ci-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r scripts/ci/requirements-ci-pip.txt
          python -m pip install --require-hashes -r scripts/ci/requirements-ci-dev.txt
          python -m pip install --no-deps -e .
      - name: Test suite with an empty home
        # The folders are made after the install, so they start empty. The
        # pytest exit status is kept and reported after the folder check, so a
        # failing test does not hide a write.
        run: |
          sandbox="${RUNNER_TEMP}/empty-home"
          mkdir -p "${sandbox}/home" "${sandbox}/config" "${sandbox}/state" \
            "${sandbox}/data" "${sandbox}/cache"
          status=0
          HOME="${sandbox}/home" USERPROFILE="${sandbox}/home" \
            XDG_CONFIG_HOME="${sandbox}/config" XDG_STATE_HOME="${sandbox}/state" \
            XDG_DATA_HOME="${sandbox}/data" XDG_CACHE_HOME="${sandbox}/cache" \
            python -m pytest -q -n auto -p no:cacheprovider || status=$?
          written="$(find "${sandbox}" -mindepth 2 | sort)"
          if [ -n "${written}" ]; then
            echo "::error title=home-isolation::The tests wrote outside their temporary folders. Paths:"
            printf '%s\n' "${written}"
            exit 1
          fi
          echo "Nothing appeared under ${sandbox}."
          exit "${status}"
