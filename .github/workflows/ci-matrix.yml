# SPDX-License-Identifier: MIT

# Cross-platform OS × Python matrix workflow.
#
# A 3 OS × 5 Python matrix running pytest with xdist-driven parallelism per
# cell; each Windows Python version runs as two shard cells, so the job has
# twenty cells in all. Complements ci.yml's `quality` job (2 OS × 5 Python,
# with the full lint + format + type-check + ecosystem-validator slate) by
# adding macOS coverage and isolating the test suite for expanded
# interpreter / OS reach.
#
# Each cell delegates to the reusable workflow at
# `.github/workflows/reusable-python-setup.yml`, which performs harden-runner
# + checkout + setup-python + dependency install + the caller-supplied
# pytest invocation. The reusable workflow declares its own `permissions:`
# block (contents: read) and per-job timeout-minutes; this workflow's
# top-level `permissions:` baseline is identical and per-cell timeouts
# are passed through.
#
# fail-fast: false — one cell's failure surfaces all 20 results rather than
# cancelling siblings on first red. Cross-platform regressions otherwise
# hide behind the first-OS failure.
#
# SHA-pinning policy: this workflow contains no direct action references
# (every `uses:` resolves to the in-repo reusable workflow). The reusable
# workflow honours the canonical SHA-pinning policy documented in ci.yml.

name: CI Matrix

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'scripts/ci/requirements-ci-dev.txt'
      - '.github/workflows/ci-matrix.yml'
      - '.github/workflows/reusable-python-setup.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'scripts/ci/requirements-ci-dev.txt'
      - '.github/workflows/ci-matrix.yml'
      - '.github/workflows/reusable-python-setup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test-matrix:
    # A Windows cell runs half the suite (see the shard note on the matrix)
    # and is named with its shard. No check of this workflow is required.
    name: pytest / ${{ matrix.os }} / py${{ matrix.python-version }}${{ matrix.shard && format(' / shard {0} of 2', matrix.shard) || '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        # The whole suite took 73 to 118 minutes on one Windows runner in
        # ci.yml (November 2026), close to the 120-minute ceiling. So each
        # Windows Python version runs as two cells, shard 1 and shard 2, each
        # with `pytest --shard=K/2` (tests/conftest.py), which together run
        # every test exactly once, as ci.yml's quality job does. Shard 0 is an
        # Ubuntu or macOS cell that runs the whole suite.
        shard: [0, 1, 2]
        exclude:
          - os: ubuntu-latest
            shard: 1
          - os: ubuntu-latest
            shard: 2
          - os: macos-latest
            shard: 1
          - os: macos-latest
            shard: 2
          - os: windows-latest
            shard: 0
    # zizmor's self-repository audit asks for GitHub's `$/` form here. The
    # pinned actionlint (v1.7.12, .pre-commit-config.yaml) rejects any
    # reusable-workflow reference that is not `owner/repo/path@ref` or `./path`,
    # so the call keeps `./` until actionlint accepts `$/`. Neither of the
    # audit's risks applies: GitHub resolves a job-level `./` call from this
    # workflow's own commit, not from files a step checked out, and the
    # repository does not require SHA-pinned actions.
    uses: ./.github/workflows/reusable-python-setup.yml  # zizmor: ignore[self-repository] see the comment above
    with:
      python-version: ${{ matrix.python-version }}
      runs-on: ${{ matrix.os }}
      requirements-file: scripts/ci/requirements-ci-dev.txt
      cache-key-suffix: ci-matrix
      # A fresh Windows runner's first node launch can take more than a minute
      # while pytest's workers keep the machine busy, so the command starts
      # node once (`node -e 0`, the engine start-up the tests need) before
      # pytest, outside the tests that run node under a timeout. ci.yml's
      # quality job does the same in its "Start node once" step.
      run-command: >-
        if command -v node >/dev/null; then time node -e 0; fi;
        python -m pytest -n auto --color=yes
        ${{ matrix.shard && format('--shard={0}/2', matrix.shard) || '' }}
      egress-policy: audit
      # A Windows shard runs half the suite, which took up to 118 minutes
      # whole, and Pytest is nearly all of a cell's time, so a shard needs
      # about 60. 90, the workflow validator's matrix-job ceiling, leaves room
      # for that on every cell and still stops a hung run.
      timeout-minutes: 90
