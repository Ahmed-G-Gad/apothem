# SPDX-License-Identifier: MIT

name: Documentation issue
description: Report missing, inaccurate, or confusing documentation
title: "[Docs]: "
labels: ["documentation", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the Apothem docs.
  - type: input
    id: doc-location
    attributes:
      label: Affected page or section
      placeholder: e.g. site/content/docs/harnesses/claude-code.mdx §3
    validations:
      required: true
  - type: textarea
    id: issue-description
    attributes:
      label: What is wrong or missing?
      description: Describe the problem with the current documentation.
    validations:
      required: true
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested improvement
      description: What would the documentation ideally say?
    validations:
      required: false
  - type: checkboxes
    id: pre-submission-checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I have searched existing issues for this documentation problem.
          required: true
