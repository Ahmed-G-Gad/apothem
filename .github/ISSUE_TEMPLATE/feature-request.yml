# SPDX-License-Identifier: MIT

name: Feature request
description: Suggest a new capability or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement. Strong feature requests describe a concrete use case, propose a specific solution, name the alternatives considered, and identify the part of the M1-M15 mandate registry the proposal touches.
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the operator workflow or scenario that motivates this request. What is the operator trying to accomplish, and what does the absence of this capability cost them today?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the capability you would like to see, including how it should behave from the operator's perspective and which artifact classes (rules, skills, commands, hooks, agents) it would touch.
    validations:
      required: true
  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives considered
      description: List the other approaches you considered and explain why they were rejected. Include any existing artifact you considered evolving rather than adding a new one.
    validations:
      required: false
  - type: textarea
    id: mandate-alignment
    attributes:
      label: Mandate-registry alignment
      description: Identify which of the M1-M15 mandates the proposal advances or touches. See `site/content/docs/governance/positioning.mdx` §3 for the registry walkthrough. If the proposal is orthogonal to the registry, say so explicitly.
      placeholder: |
        e.g. "Strengthens M5 (Authority Principle) by routing X through the canonical inquiry channel"
        or  "Orthogonal - adds tooling around M13 code craft without touching the registry semantics"
    validations:
      required: true
  - type: checkboxes
    id: pre-submission-checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I have searched existing issues and discussions for similar requests.
          required: true
        - label: I have read CONTRIBUTING.md.
          required: true
