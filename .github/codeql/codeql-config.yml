# CodeQL analysis configuration for the Apothem source surface.
#
# Query suite: `security-extended` — the full security query catalogue at
# extended precision. The `security-and-quality` suite's additional code-quality
# catalogue is intentionally not run here: on this codebase it is dominated by
# the intentional re-export-facade import pattern (the `install_driver` package
# aggregates its split submodules), producing hundreds of non-actionable
# cyclic-import / re-export findings that obscure the security signal. Code
# quality is enforced separately and authoritatively by `ruff` and `mypy` in CI.
# Centralized here (rather than as a workflow `queries:` input) so the suite
# selection and the path scoping live in one place.
#
# Path scoping — two classes of non-first-party code are excluded from analysis:
#
#   1. Vendored third-party trees under `src/apothem/_vendor/` (attrs, PyYAML,
#      jsonschema, referencing, typing_extensions). Apothem ships these
#      dependencies vendored and does not modify their source, so a finding in
#      that tree is not actionable downstream; supply-chain risk in the
#      dependencies is covered separately by pip-audit and dependency-review.
#   2. Generated behavior-diff golden fixtures under
#      `tests/fixtures/behavior-diff/`. These are materialized copies of the
#      engine rendered into each harness's layout, regenerated by
#      `scripts/dev/regen-behavior-goldens.py`; analyzing them re-reports the
#      same findings already covered by the first-party source they mirror.
#
# Excluding both keeps the Security tab scoped to hand-authored first-party
# code. First-party code outside these subtrees remains fully analyzed.
name: "Apothem CodeQL config"

queries:
  - uses: security-extended

paths-ignore:
  - src/apothem/_vendor
  - tests/fixtures/behavior-diff
