# SPDX-License-Identifier: MIT

title: Show and tell
labels:
  - show-and-tell
body:
  - type: markdown
    attributes:
      value: |
        Built something with Apothem? Share it!
  - type: textarea
    id: project
    attributes:
      label: What did you build?
      description: Describe your project and how you used Apothem.
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links
      description: Repo, demo, screenshot, or write-up links.
    validations:
      required: false
