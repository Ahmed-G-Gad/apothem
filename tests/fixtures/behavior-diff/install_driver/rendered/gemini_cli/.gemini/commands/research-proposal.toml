## Workflow — Five Phases

| Phase | Name | Step contract |
| ----- | ---- | ------------- |
| 1 | Ingest the Gap & Frame the Aims | load-context |
| 2 | SMART Aims Hierarchy & Feasibility | execute |
| 3 | Resource / Timeline / Risk Register & Preregistration Plan | execute (R5) |
| 4 | Impact Pathway & Reporting-Guideline Pre-Selection | execute (R10, R9) |
| 5 | Validation Gate | gate + report |

### Phase 1 — Ingest the Gap & Frame the Aims

Read `{suite}/_inputs/synthesis.md` and `{suite}/_inputs/theory.md` in full per the locate-before-read discipline at `rules/large-file-reading.md`. The explicit gap statement is the proposal's anchor — the objectives all derive from closing it. Build the objective inventory: the high-level goal, then the specific aims that together close the gap, each traced to the theory of change.

**A supplied funder call governs the proposal's shape.** When `--call` supplies the call text, read it in full: the funder's section structure, limits, applicant eligibility, review criteria, required attachments, and tool-use rules come from that text, never from recall, and no opportunity lookup runs. Externalise the **call-requirement matrix** to `{suite}/_inputs/call-requirements.md` (a free-form scratch file per `rules/context-management-scratch.md` §1), one row per requirement: its locator in the call text; its type (section, limit, eligibility, attachment, review criterion, policy); the proposal section that answers it; the draft location in the operator's draft (path and anchor, or `none`); and its status (`met`, `partly-met`, `gap`, `operator-owned`) with the gap action. A review criterion is a row, so each aim traces to the criterion it answers; no criterion gets a weight, and no claim about funding odds is made. When the operator supplies a draft, a criterion row also carries the draft's evidence for the criterion (path and anchor), the weakness that remains, and the proposed revision.

- **Identity records are placeholders.** Team, biographical statements, facilities, letters of support, and current-and-pending support belong to the operator (R6): each is an `operator-owned` row, never drafted.
- **Tool-use policy gate.** The call's policy on automated-tool use resolves first, to `permitted`; `permitted with disclosure` (the tool-and-model statement is drafted per `rules/authoritative-referencing-assurance.md` §5 and placed where the call asks); or `restricted`. The matrix restates the call and drafts no submission text, so it is written in every outcome. Plan text the operator MAY carry into a submission is written only when the policy is not `restricted`; under `restricted` the command stops after the matrix and returns the decision to the operator. A call silent on the policy is an operator inquiry, never an assumption.

### Phase 2 — SMART Aims Hierarchy & Feasibility

Express the objectives as a **SMART aims hierarchy** per the [Analysis Function Theory of Change Toolkit](https://analysisfunction.civilservice.gov.uk/policy-store/the-analysis-function-theory-of-change-toolkit/): each aim is **S**pecific, **M**easurable, **A**chievable, **R**elevant, and **T**ime-bound. Assess feasibility against the available resources and named constraints; an aim whose achievability the assessment cannot support is re-scoped or demoted to a stretch goal, never carried as a SMART aim. Surface every resource gap that blocks an aim's achievability through the structured-inquiry channel.

### Phase 3 — Resource / Timeline / Risk Register & Preregistration Plan (R5)

Build the resource / timeline / risk register: each aim's resource demand, the timeline that sequences the aims, and a risk register where each risk is a refutable prediction of how the plan fails, with its mitigation. Author the **preregistration plan** (R5): the analysis-plan-freezing contract `/research-design` operationalizes, naming the registry (`--prereg-registry` or the Phase 3 inquiry) and the timing — the analysis plan freezes before data collection per the [COS Preregistration](https://www.cos.io/initiatives/prereg) standard. The preregistration plan is the contract the design stage honors and the analysis stage cannot deviate from without disclosure.

**Stress-test the plan and attach contingencies.** Complete a contingency record for each register row whose consequence reaches an aim's achievability, and run the plan stress test on the decisions those rows put at risk, per `skills/research-suite/references/plan-branching-and-contingencies.md` (R3, R5).

**Reconcile the budget; never build it.** From operator-supplied cost lines, check that every line traces to an aim or task, that every aim has resourcing (a cost line or a stated `no cost`), and that the lines sum to the stated total per period and fit any limit the call text states. A line tracing to nothing is `orphan`, an aim without resourcing is `unresourced`, and a mismatch is `unreconciled`; each returns to the operator through the structured-inquiry channel. The command adds no cost line and recalls no cost, rate, overhead, salary, or cap; summing the supplied lines is the check (R6).

### Phase 4 — Impact Pathway & Reporting-Guideline Pre-Selection (R10, R9)

Map the **impact pathway** (R10) per the [NWO Impact Plan Approach](https://www.nwo.nl/en/impact-plan-approach): the route from the study's outputs through its outcomes to its intended impact, traced to the theory of change. Pre-select the field-appropriate **EQUATOR reporting guideline** (R9) — PRISMA for evidence synthesis, CONSORT for trials, STROBE for observational studies, or the design-matched guideline (`--guideline` or the derived candidate, ratified via inquiry). The pre-selection commits the downstream stages to the guideline's structure.

**Pre-commit the data management and sharing plan (R8)** beside the guideline pre-selection, so the plan a funder asks for exists before the design stage fixes the data: the data and code produced (form and volume as the operator supplies them, or `not supplied`); metadata and format standards; the repository class and persistent-identifier scheme, with the repository named by the operator or the call; access terms and, for each restriction, its basis (consent scope, privacy law, licence); the retention period the call or institution sets; the stewardship role; and the implied cost lines, reconciled under the Phase 3 budget check. A form or limit in the call text governs the layout. The consent scope MUST permit the sharing the plan promises (R6); a mismatch is a §3 feasibility finding. `/research-design` operationalizes the plan, and a later change is disclosed per `rules/disclosure-ledger.md`.

**Scale rigor and the evidence package to the target-venue ambition.** The target-venue ambition sets not only the reporting-guideline choice but the depth of the rigor floor the downstream design and experiment stages MUST clear — the replication floor, the budget parity, the tuning split, and the significance-plus-effect-size-plus-ranks reporting are pre-committed here and run downstream — and the reproducibility-evidence outputs the deliverable's evidence package will carry, per `skills/research-suite/references/advancement-gate.md` (R9). A higher-ambition target raises the bar the statistical thresholds and the required-artifact set MUST meet. Surface the target-venue ambition through the structured-inquiry channel when it is unnamed; NEVER invent it. Surface the ethics feasibility (R6): the human / animal / data-privacy considerations the study will carry, flagged up front so the design stage plans for approval, not in response to a reviewer. Author the impact-pathway diagram with the metadata header per `rules/visual-leverage.md`. Emit `{suite}/_inputs/proposal.md` with the canonical sections enumerated in `## Output`. Apply incremental generation per `rules/large-file-generation.md` when the proposal exceeds 500 lines.

### Phase 5 — Validation Gate

Run the fifteen-bar pre-emission gate per `rules/pre-emission-gate.md` against the emitted proposal. M5 authority: every resource estimate, budget figure, call requirement, registry name, contingency role, and ethics fact traces to suite-recorded, call-text, or operator-supplied data (R6); no unfilled authority-inquiry placeholder remains. M8 definitiveness: the aims and the impact pathway carry no hedging vocabulary. M9 visual leverage: the impact pathway and the risk register render with the metadata header. M14 systemicity: the proposal declares its upstream (synthesis + theory), downstream (`/research-design`), peers (sibling research-suite artifacts), and enforcers (the SMART-aims completeness check + the preregistration-plan presence check + the call-requirement matrix completeness check when a call is supplied). Iterate on failure per the gate rule's §3 until every bar passes or its three-round cap returns BLOCKED; record the attestation block inside the proposal and update the Handoff Manifest.

