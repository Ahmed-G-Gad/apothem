# schemas/header-visibility.yaml
#
# Per-file-class visibility policy for the authorship-header banner
# in Markdown files, per spec §4.6.5.
#
# - `invisible` (default): banner wrapped in `<!-- ... -->`, source-visible
#   only; the rendered Markdown surface stays clean.
# - `visible`: banner appears at the top of the rendered output as a
#   plain text or fenced-code block; appropriate for stand-alone
#   reference documents that benefit from immediately readable provenance.
# - `special-rendered`: format-bound files (e.g., CHANGELOG.md per
#   release-notes format) where the banner sits as a single
#   HTML-comment block above the format header rather than being
#   interleaved into the format body.
#
# An override at file scope is intended as an inline marker
# `<!-- header-visibility: visible -->` immediately after the banner;
# the inline marker would take precedence over the per-class default.
#
# This file is documentary policy. No tool reads it. The injector
# (`scripts/inject-header.{sh,py}`) always writes the invisible form for
# Markdown and MDX, and it does not parse the class overrides or the inline
# marker. The visible and special-rendered classes describe intended behavior
# that is not implemented. See reference/authorship-header.mdx, section 6.

default-visibility: invisible

class-overrides:
  - class: spec-document
    visibility: visible
    pattern: "**/spec*.md"

  - class: changelog
    visibility: special-rendered
    pattern: "**/CHANGELOG.md"

  - class: license-readable
    visibility: visible
    pattern: "**/LICENSE.md"
