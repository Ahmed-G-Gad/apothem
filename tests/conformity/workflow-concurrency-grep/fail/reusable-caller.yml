# SPDX-License-Identifier: MIT

name: reusable-caller

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  caller-windows-over:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    uses: ./.github/workflows/reusable.yml
    with:
      runs-on: ${{ matrix.os }}
      timeout-minutes: ${{ matrix.os == 'windows-latest' && 150 || 90 }}

  caller-other-over:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    uses: ./.github/workflows/reusable.yml
    with:
      runs-on: ${{ matrix.os }}
      timeout-minutes: ${{ matrix.os == 'windows-latest' && 120 || 95 }}

  caller-expression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    uses: ./.github/workflows/reusable.yml
    with:
      runs-on: ${{ matrix.os }}
      timeout-minutes: ${{ inputs.minutes }}

  caller-integer-over:
    uses: ./.github/workflows/reusable.yml
    with:
      timeout-minutes: 60
