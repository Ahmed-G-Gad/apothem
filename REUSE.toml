# ---------------------------------------------------------------------------
# DX-1 behavior-diff golden corpus (tests/fixtures/behavior-diff/**).
#
# Generated oracle for the install_driver decomposition: rendered native
# files, dry-run envelopes, plans, and ledger JSONL captured per adapter by a
# capture script under the project-local `.apothem/plans/` working tree (the
# gitignored generation harvest). Some rendered files
# are byte-identical copies of real source files that already carry their own
# header line; the override forces uniform MIT attribution so the generated
# corpus stays REUSE-clean without editing the captured bytes (editing them
# would defeat the byte-identical behavior oracle).
# ---------------------------------------------------------------------------
[[annotations]]
path = ["tests/fixtures/behavior-diff/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Ahmed G. Gad <me@ahmedgad.com>"
SPDX-License-Identifier = "MIT"

