# ---------------------------------------------------------------------------
# Apothem working directory (.apothem/) — gitignored ephemera, never shipped.
# The canonical project-local working dir (plans, memory, session scratch)
# now lives under `.apothem/`; `.gitignore` ignores `.apothem/*` and re-includes
# only `!.apothem/.keep`. Making the `.apothem/.keep` marker committable forces
# REUSE to descend into `.apothem/`. Session-local scratch there (deterministic
# transform-record scripts, the generation harvest) may carry SPDX tokens in its
# CONTENT. This override declares the whole tree apothem's MIT work and overrides
# any in-content SPDX expression so the gitignored ephemera never trips reuse.
# A fresh clone contains only `.apothem/.keep`, so this annotation is vacuous
# downstream.
#
# The legacy `.plans/**` annotation is retained for any working tree an operator
# has not yet upgraded with `apothem migrate-workspace`; it is vacuous on a
# fresh clone (which carries no `.plans/` tree at all).
# ---------------------------------------------------------------------------

[[annotations]]
path = [".apothem/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Ahmed G. Gad <me@ahmedgad.com>"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [".plans/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Ahmed G. Gad <me@ahmedgad.com>"
SPDX-License-Identifier = "MIT"

