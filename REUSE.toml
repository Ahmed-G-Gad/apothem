version = 1

# ---------------------------------------------------------------------------
# Tree-wide copyright baseline (machine-readable projection of the LICENSE
# copyright instrument)
#
# The project's File Headers discipline carries a single
# `SPDX-License-Identifier: MIT` line per applicable file and NO per-file
# copyright line — the root LICENSE is the canonical copyright instrument.
# REUSE 3.3 compliance, however, requires copyright information for every
# tracked file. This catch-all supplies that copyright as the lowest-precedence
# baseline: it is the FIRST [[annotations]] table, so every more-specific table
# below overrides it (REUSE.toml resolves multiple matches by "last matching
# table wins"). In particular, the vendored-dependency tables further down keep
# each subtree's TRUE upstream copyright, and the typing_extensions table keeps
# the PSF license — those win over this baseline. Per-file inline SPDX license
# lines continue to supply each file's license under default `closest`
# precedence; this table only fills in the copyright the one-line-header
# convention omits.
# ---------------------------------------------------------------------------

[[annotations]]
path = ["**"]
SPDX-FileCopyrightText = "2026 Ahmed G. Gad <me@ahmedgad.com>"
SPDX-License-Identifier = "MIT"

