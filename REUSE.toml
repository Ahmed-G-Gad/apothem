# ---------------------------------------------------------------------------
# SPDX-discussion files — precedence override
#
# These files legitimately contain the literal text `SPDX-License-Identifier:`
# inside prose, docstrings, code comments, or test/fixture content that
# DISCUSSES the authorship-header convention (the root agent-instruction
# surfaces, the header-injector, the conformity matchers that grep for the
# marker, the header-form test fixtures, the hook-message contexts, the doc
# pages on the header convention). `reuse lint` parses each such occurrence as
# an in-file SPDX expression and reports it as malformed.
#
# Per the REUSE 3.3 specification, licensing information declared as part of
# documentation or command output is handled with `precedence = "override"`
# so the REUSE.toml annotation is authoritative and the in-prose text is not
# parsed as a real declaration. The list is enumerated explicitly (never a
# broad source glob) so the override never masks a genuinely malformed header
# on a real source file — only the files that demonstrably discuss the
# convention are covered. Refresh this list when a new file begins discussing
# the SPDX header in its body.
# ---------------------------------------------------------------------------

[[annotations]]
precedence = "override"
path = [
  ".github/copilot-instructions.md",
  "AGENTS.md",
  "CLAUDE.md",
  "scripts/dev/regenerate-completions.ps1",
  "scripts/dev/regenerate-completions.sh",
  "scripts/inject-header.py",
  "site/content/docs/reference/ai-conventions.mdx",
  "site/content/docs/reference/authorship-header.mdx",
