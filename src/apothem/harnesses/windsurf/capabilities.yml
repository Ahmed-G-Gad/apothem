# Per rules/agent-capability-discipline.md §1 / §3 / §7. Devin Desktop's
# Cascade agent reads MCP from ~/.config/devin/mcp_config.json and the Devin
# Local agent from the Devin CLI config files (operator-owned; the adapter
# recognizes them but does not author entries). The windsurf
# harness rebranded to Devin Desktop (OTA 2026-06-02); the adapter delivers a
# project rules file under the preferred .devin/rules/ surface (which takes
# precedence over the .windsurf/rules/ backward-compat fallback), installs
# skills and command skills at the shared user-level ~/.agents/skills/ and the
# rules and templates corpus at ~/.config/apothem/, and writes eleven of
# Apothem's fourteen agents as Devin Local subagents in .devin/agents/ (project
# scope only; the legacy Cascade agent has no subagents). Devin Local delegates
# to subagents natively (docs.devin.ai/cli/subagents), a feature the vendor
# labels experimental. The adapter registers two hooks for Devin Local
# (SessionStart and PostToolUse, the events whose additionalContext Devin hands
# to the model) in the local config file .devin/config.local.json, with the
# scripts under .apothem/support/windsurf/hooks/; the PreToolUse guards are not
# registered because Devin documents no context channel there. The legacy
# Cascade agent reads a different hook format (.devin/hooks.json) that the
# adapter does not write. The adapter authors no workflow cohort.

mcp_servers:
  - user-scope-~/.config/devin/mcp_config.json
# Operator-owned MCP surface: the adapter recognizes it but authors no entries.
mcp_servers_authored: false
sub_agent_dispatch: true
custom_command_support: "skills"
recommended_postfix_rendering: "plain-text"
long_context_compaction: "profile-managed"
context_ignore_surface: "not-documented-in-current-pin"
layered_context_surface: ".devin/rules/*.md directory (preferred; .windsurf/rules/ backward-compat fallback) plus .devin/agents/*.md subagents, .devin/config.local.json hooks with scripts in .apothem/support/windsurf/hooks/, ~/.agents/skills (skills and command skills) and ~/.config/apothem/{rules,templates}"
lsp_symbol_navigation: "tracked-gap-no-adapter-owned-LSP-surface"
hook_learning_capture: "config.local.json-hooks"
standard_convention_pin: "STANDARD-CONVENTION-PIN.md"
# web-fetch / browser-retrieval surface — the backing capability dimension for
# rules/source-accessibility.md step 1 ("retrieve through the host's browser /
# fetch capability"). Vendor-confirmed: Windsurf's Cascade agent ships Web Search
# + URL Read (page fetch/chunk) tools, forced via `@web` and `@docs`, gated by
# the "Enable Web Search" admin setting. The evidence triple (vendor-doc-url on
# the current docs.devin.ai host, snapshot-id, snapshot-date) lives at its
# canonical home, STANDARD-CONVENTION-PIN.md "Official Surface Refresh", per
# rules/agent-capability-discipline-matrix.md §1A.
web_fetch: "yes"
tool_surface_restrictions:
  - secrets-paths
  - destructive-shell-ops
  - network-write-unsigned
system_prompt_template_path: "templates/apothem-rules.md"
agent_memory_surface: "n/a"

# Commands ship as skills in ~/.agents/skills/ with the shared skill emission, so the
# bytes are the same whichever adapter writes the folder: version, updated and
# portability fold under the standard `metadata` map, and the other source keys
# stay top-level. Windsurf's docs list name and description; how it
# treats the keys it does not list is the open question recorded in
# STANDARD-CONVENTION-PIN.md.
conversion_losses:
  commands:
    name: "native:name"
    description: "native:description"
    argument-hint: "ignored"
    disable-model-invocation: "ignored"
    allowed-tools: "ignored"
    version: "native:metadata.version"
    updated: "native:metadata.updated"
    portability: "native:metadata.portability"

# Agents ship as Devin Local subagents in <project>/.devin/agents/<name>.md (see
# harnesses/_shared/install_driver_agent_kimi_devin.py). Devin documents name,
# description, model, allowed-tools (alias tools) and max-nesting. allowed-tools
# is a list of lowercase tool names (read, edit, grep, glob, exec, write) and is
# the only restriction, with no deny key, so the source tools minus
# disallowedTools compile to one allowlist: disallowedTools is folded into
# allowed-tools, and Bash is exec. The three agents that need web tools
# (citation-auditor, fact-checker, research-scout) are not installed, because
# Devin documents no allowed-tools name for them. No model is written (Devin's
# default subagent model is router-selected and is not the parent's), Devin
# documents no turn limit, and version, updated and portability are Apothem
# metadata Devin does not list.
  agents:
    name: "native:name"
    description: "native:description"
    tools: "native:allowed-tools"
    disallowedTools: "native:allowed-tools"
    maxTurns: "dropped"
    version: "dropped"
    updated: "dropped"
    portability: "dropped"
