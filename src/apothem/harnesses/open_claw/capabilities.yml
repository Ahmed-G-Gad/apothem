# Per rules/agent-capability-discipline.md §1 / §3 / §7. The open_claw
# harness (a multi-channel messaging gateway) pins ~/.openclaw/openclaw.json
# (JSON5). Per the 2026-11-03 pin: skills load from the workspace, ~/.agents/skills,
# ~/.openclaw/skills and, after the agent's other skill sources, each directory
# listed under skills.load.extraDirs; the adapter lists its support skills
# directory there and authors nothing else for skills. The agents.defaults.skills
# allowlist and the per-agent agents.entries.<id>.skills lists are operator-owned
# and the adapter edits neither. Subagents are documented via
# agents.entries.<id>.subagents.allowAgents. OpenClaw injects AGENTS.md and five
# other files from each agent's workspace; the adapter writes none of them, and
# per the 2026-11-08 pin brings its rules in as <workspace>/apothem/AGENTS.md,
# registered with the bundled bootstrap-extra-files hook. MCP
# servers live in the mcp.servers config block, managed via the `openclaw mcp`
# CLI; the adapter authors no MCP entries.
# Tool-surface universal-deny floor binds regardless.

mcp_servers: []
# Operator-owned MCP surface: the adapter recognizes it but authors no entries.
mcp_servers_authored: false
sub_agent_dispatch: true
custom_command_support: "skills-extraDirs"
recommended_postfix_rendering: "plain-text"
long_context_compaction: "profile-managed"
context_ignore_surface: "not-documented-in-current-pin"
layered_context_surface: "openclaw.json skills.load.extraDirs plus support skills; <workspace>/apothem/AGENTS.md via the bootstrap-extra-files hook"
lsp_symbol_navigation: "tracked-gap-no-adapter-owned-LSP-surface"
hook_learning_capture: "artifact-evolution-cycle"
standard_convention_pin: "STANDARD-CONVENTION-PIN.md"
# web-fetch / browser-retrieval surface — the backing capability dimension for
# rules/source-accessibility.md step 1 ("retrieve through the host's browser /
# fetch capability"). The pinned snapshot catalogs config-materialization
# surfaces, not the vendor tool surface, so the web-fetch tool is not yet
# discovered against the pin — discovery-pending per
# rules/agent-capability-discipline-matrix.md §1.
web_fetch: "discovery-pending"
tool_surface_restrictions:
  - secrets-paths
  - destructive-shell-ops
  - network-write-unsigned
system_prompt_template_path: "n/a"
agent_memory_surface: "<agent workspace>/MEMORY.md and USER.md (vendor-managed; ~/.openclaw/workspace by default, one workspace per agent)"
# What each source frontmatter key becomes in a converted cohort (see
# tests/unit/test_conversion_losses.py for the value vocabulary). Commands land
# as SKILL.md under .apothem/support/skills/, which skills.load.extraDirs lists.
# TODO(clarify): the skills page lists OpenClaw's optional SKILL.md frontmatter
# keys (#optional-frontmatter-keys, read 2026-11-03), but every key stays
# "ignored" (kept as text, not shown to be read) until a change maps each
# Apothem key to what OpenClaw does with it.
conversion_losses:
  commands:
    name: "ignored"
    description: "ignored"
    argument-hint: "ignored"
    disable-model-invocation: "ignored"
    allowed-tools: "ignored"
    version: "ignored"
    updated: "ignored"
    portability: "ignored"
