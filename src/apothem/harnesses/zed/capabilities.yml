# Per rules/agent-capability-discipline.md §1 / §3 / §7. Zed ratifies
# MCP context servers via .zed/settings.json (and global settings)
# `context_servers` (operator-owned; the adapter recognizes it but does
# not author entries). DIVERGENCE: Zed reads one project instruction file,
# the first match in a list that starts with the flat project-root `.rules`
# (then .cursorrules, .windsurfrules, .clinerules, copilot-instructions.md,
# AGENT.md, AGENTS.md, CLAUDE.md, GEMINI.md) — not a dedicated Apothem file
# inside a rules directory. A new `.rules` hides the lower-priority files, so
# the install warns when one of them holds operator text.
# The adapter writes that flat `.rules` file, backing up any pre-existing
# `.rules` before replace, installs skills and command skills at the shared
# user-level ~/.agents/skills/ and the rules and templates corpus at
# ~/.config/apothem/, and does not dispatch sub-agents or author
# workflow/hook cohorts.

mcp_servers:
  - project-scope-.zed/settings.json#context_servers
# Operator-owned MCP surface: the adapter recognizes it but authors no entries.
mcp_servers_authored: false
sub_agent_dispatch: false
custom_command_support: "skills"
recommended_postfix_rendering: "plain-text"
long_context_compaction: "profile-managed"
context_ignore_surface: "not-documented-in-current-pin"
layered_context_surface: "project-root .rules flat file (no rules directory) plus ~/.agents/skills (skills and command skills) and ~/.config/apothem/{rules,templates}"
lsp_symbol_navigation: "tracked-gap-no-adapter-owned-LSP-surface"
hook_learning_capture: "artifact-evolution-cycle"
standard_convention_pin: "STANDARD-CONVENTION-PIN.md"
# web-fetch / browser-retrieval surface — the backing capability dimension for
# rules/source-accessibility.md step 1 ("retrieve through the host's browser /
# fetch capability"). The pinned snapshot catalogs config-materialization
# surfaces, not the vendor tool surface, so the web-fetch tool is not yet
# discovered against the pin — discovery-pending per
# rules/agent-capability-discipline-matrix.md §1.
web_fetch: "discovery-pending"
tool_surface_restrictions:
  - secrets-paths
  - destructive-shell-ops
  - network-write-unsigned
system_prompt_template_path: "templates/apothem-rules.md"
agent_memory_surface: "n/a"

# Commands ship as skills in ~/.agents/skills/ with the shared skill emission, so the
# bytes are the same whichever adapter writes the folder: version, updated and
# portability fold under the standard `metadata` map, and the other source keys
# stay top-level. Zed's docs list name and description; how it
# treats the keys it does not list is the open question recorded in
# STANDARD-CONVENTION-PIN.md.
conversion_losses:
  commands:
    name: "native:name"
    description: "native:description"
    argument-hint: "ignored"
    disable-model-invocation: "ignored"
    allowed-tools: "ignored"
    version: "native:metadata.version"
    updated: "native:metadata.updated"
    portability: "native:metadata.portability"
