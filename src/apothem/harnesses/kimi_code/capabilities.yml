# Per rules/agent-capability-discipline.md §1 / §3 / §7. The kimi_code
# harness (Kimi Code CLI, Moonshot) reads project-root AGENTS.md as its
# agent-instructions surface and keeps project configuration under
# <project>/.kimi-code/. Apothem writes the AGENTS.md managed block, installs
# skills and command skills at the native <project>/.kimi-code/skills/, installs
# the agents as Kimi Code sub-agents at <project>/.kimi-code/agents/, and keeps
# an Apothem support tree under <project>/.kimi-code/.apothem/support/ for the
# cohorts it does not install natively (rules, templates, hooks). MCP is
# the recognized operator-owned surface at <project>/.kimi-code/mcp.json; Apothem
# names it but defers authoring entries. The vendor docs are pinned in
# STANDARD-CONVENTION-PIN.md (snapshot-date 2026-10-27); the model FAMILY is
# vendor-pinned, never adapter-authored.

mcp_servers:
  - project-scope-.kimi-code/mcp.json-operator-owned
# Operator-owned MCP surface: the adapter recognizes it but authors no entries.
mcp_servers_authored: false
sub_agent_dispatch: true
custom_command_support: "yes"
recommended_postfix_rendering: "plain-text"
long_context_compaction: "profile-managed"
context_ignore_surface: "not-documented-in-current-pin"
layered_context_surface: "AGENTS.md plus <project>/.kimi-code/skills/ (skills and command skills), <project>/.kimi-code/agents/*.md sub-agents and <project>/.kimi-code/.apothem/support/{hooks,rules,templates}"
lsp_symbol_navigation: "tracked-gap-no-adapter-owned-LSP-surface"
hook_learning_capture: "artifact-evolution-cycle"
standard_convention_pin: "STANDARD-CONVENTION-PIN.md"
# web-fetch / browser-retrieval surface — the backing capability dimension for
# rules/source-accessibility.md step 1 ("retrieve through the host's browser /
# fetch capability"). Vendor-confirmed: Kimi Code ships built-in FetchURL (page
# body text) and WebSearch tools, both auto-allowed. Evidence: vendor-doc-url
# https://moonshotai.github.io/kimi-code/en/reference/tools; snapshot-id living
# docs; snapshot-date 2026-10-03 (canonical home: STANDARD-CONVENTION-PIN.md).
web_fetch: "yes"
tool_surface_restrictions:
  - secrets-paths
  - destructive-shell-ops
  - network-write-unsigned
system_prompt_template_path: "templates/AGENTS.md"
agent_memory_surface: "AGENTS.md durable context (memory bank)"

# Commands ship to .kimi-code/skills/ as skills with every source key kept.
# Kimi Code's skills page documents name, description and
# disable-model-invocation (alongside type, whenToUse and arguments); the other
# keys stay in the file, and how Kimi treats them is the open question in
# STANDARD-CONVENTION-PIN.md.
conversion_losses:
  commands:
    name: "native:name"
    description: "native:description"
    argument-hint: "ignored"
    disable-model-invocation: "native:disable-model-invocation"
    allowed-tools: "ignored"
    version: "ignored"
    updated: "ignored"
    portability: "ignored"

# Agents ship as Kimi Code sub-agents in <project>/.kimi-code/agents/<name>.md (see
# harnesses/_shared/install_driver_agent_kimi_devin.py). Kimi Code reads name,
# description (required), whenToUse, override, tools, disallowedTools and
# subagents, and ignores every other key. tools and disallowedTools are written
# as lists of Kimi tool names (WebFetch becomes FetchURL and TodoWrite becomes
# TodoList; a name Kimi Code has no tool for, such as MultiEdit or Monitor, is
# left out; a grant that loses every name is written as tools: [] because an
# omitted tools allows every tool). Kimi Code has no per-agent model key and no
# turn limit, so neither model nor maxTurns is written; override and subagents
# are never written; version, updated and portability are Apothem metadata
# Kimi Code does not read.
  agents:
    name: "native:name"
    description: "native:description"
    tools: "native:tools"
    disallowedTools: "native:disallowedTools"
    maxTurns: "dropped"
    version: "dropped"
    updated: "dropped"
    portability: "dropped"
