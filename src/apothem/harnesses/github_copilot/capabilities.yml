# Per rules/agent-capability-discipline.md §1 / §3 / §7. GitHub Copilot
# anchors project-scope .github/copilot-instructions.md; the vendor also
# recognizes .github/instructions/*.instructions.md, AGENTS.md, and root
# CLAUDE.md/GEMINI.md, but the adapter delivers the repo-wide
# instructions file, plus skills and command skills at the shared user-level
# ~/.agents/skills/ and the rules and templates corpus at ~/.config/apothem/
# (a folder on the machine that GitHub-hosted surfaces do not read), and writes
# Apothem's agents as custom agent profiles in .github/agents/*.agent.md
# (project scope only; the repository commits them and the cloud agent reads
# them). It registers two hooks, sessionStart and postToolUse (the events whose
# additionalContext Copilot hands to the model), in the Apothem-owned
# .github/hooks/apothem.json with the scripts under
# .apothem/support/github-copilot/hooks/; preToolUse is not registered because
# Copilot reads only its permission fields. The cloud agent runs the bash
# command only. Copilot delegates to custom agents natively (the agent tool alias,
# docs.github.com/en/copilot/reference/custom-agents-configuration). The adapter
# authors no MCP entries, so mcp_servers stays []; no durable memory surface.
# Universal-deny floor binds.

mcp_servers: []
# Operator-owned MCP surface: the adapter recognizes it but authors no entries.
mcp_servers_authored: false
sub_agent_dispatch: true
custom_command_support: "skills"
recommended_postfix_rendering: "plain-text"
long_context_compaction: "profile-managed"
context_ignore_surface: "not-documented-in-current-pin"
layered_context_surface: "copilot-instructions.md plus instructions directory and .github/agents/*.agent.md custom agents, .github/hooks/apothem.json hooks with scripts in .apothem/support/github-copilot/hooks/, ~/.agents/skills (skills and command skills) and ~/.config/apothem/{rules,templates}"
lsp_symbol_navigation: "tracked-gap-no-adapter-owned-LSP-surface"
hook_learning_capture: "hooks/apothem.json-hooks"
standard_convention_pin: "STANDARD-CONVENTION-PIN.md"
# web-fetch / browser-retrieval surface — the backing capability dimension for
# rules/source-accessibility.md step 1 ("retrieve through the host's browser /
# fetch capability"). Vendor-confirmed: GitHub Copilot CLI (the agent-invocable
# surface, distinct from the IDE extension) ships a `web_fetch` tool. This row
# reflects the Copilot CLI tool surface; the adapter itself materializes only
# .github/copilot-instructions.md and authors no tool config. The evidence
# triple (vendor-doc-url, snapshot-id, snapshot-date) lives at its canonical
# home, STANDARD-CONVENTION-PIN.md "Web-Fetch / Browser-Retrieval Surface", per
# rules/agent-capability-discipline-matrix.md §1A.
web_fetch: "yes"
tool_surface_restrictions:
  - secrets-paths
  - destructive-shell-ops
  - network-write-unsigned
system_prompt_template_path: "templates/copilot-instructions.md"
agent_memory_surface: "n/a"

# Commands ship as skills in ~/.agents/skills/ with the shared skill emission, so the
# bytes are the same whichever adapter writes the folder: version, updated and
# portability fold under the standard `metadata` map, and the other source keys
# stay top-level. GitHub Copilot's docs list name and description; how it
# treats the keys it does not list is the open question recorded in
# STANDARD-CONVENTION-PIN.md.
conversion_losses:
  commands:
    name: "native:name"
    description: "native:description"
    argument-hint: "ignored"
    disable-model-invocation: "ignored"
    allowed-tools: "ignored"
    version: "native:metadata.version"
    updated: "native:metadata.updated"
    portability: "native:metadata.portability"

# Agents ship as custom agent profiles in <project>/.github/agents/<name>.agent.md
# (see harnesses/_shared/install_driver_agent_copilot_cursor.py). Copilot
# documents name, description (required), tools, model and more. Its tools key is
# an allowlist of tool aliases (execute, read, edit, search, agent, web, todo)
# with no deny key, so the source tools minus disallowedTools compile to one
# allowlist: disallowedTools is folded into tools, and an alias that covers a
# tool the source denies is left out. A grant that loses every alias is written
# as an empty list, never omitted. The cloud agent does not honor the web and
# todo aliases. Copilot documents no turn limit, no model is written, and
# version, updated and portability are Apothem metadata Copilot does not list.
  agents:
    name: "native:name"
    description: "native:description"
    tools: "native:tools"
    disallowedTools: "native:tools"
    maxTurns: "dropped"
    version: "dropped"
    updated: "dropped"
    portability: "dropped"
