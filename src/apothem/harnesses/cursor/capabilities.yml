# Per rules/agent-capability-discipline.md §1 / §3 / §7 and the matrix
# companion §3. Cursor ratifies MCP via ~/.cursor/mcp.json (user-scope)
# plus project-level .cursor/mcp.json; rules surface as MDC files under
# .cursor/rules/. The adapter delivers a project rules file, installs skills
# and command skills at the shared user-level ~/.agents/skills/ and the rules
# and templates corpus at ~/.config/apothem/, and writes Apothem's agents as
# Cursor subagents in .cursor/agents/ (project scope only). Cursor delegates to
# subagents natively (cursor.com/docs/subagents); the adapter authors no hook
# cohort, and the Cursor plugin mechanism is operator-driven.

mcp_servers:
  - user-scope-~/.cursor/mcp.json
  - project-scope-.cursor/mcp.json
# Operator-owned MCP surface: the adapter recognizes it but authors no entries.
mcp_servers_authored: false
sub_agent_dispatch: true
custom_command_support: "skills"
recommended_postfix_rendering: "plain-text"
long_context_compaction: "profile-managed"
context_ignore_surface: "not-documented-in-current-pin"
layered_context_surface: ".cursor/rules MDC files plus .cursor/agents/*.md subagents, ~/.agents/skills (skills and command skills) and ~/.config/apothem/{rules,templates}"
lsp_symbol_navigation: "tracked-gap-no-adapter-owned-LSP-surface"
hook_learning_capture: "artifact-evolution-cycle"
standard_convention_pin: "STANDARD-CONVENTION-PIN.md"
# web-fetch / browser-retrieval surface — the backing capability dimension for
# rules/source-accessibility.md step 1 ("retrieve through the host's browser /
# fetch capability"). Vendor-confirmed: Cursor's agent has a Browser tool that
# visits URLs and browses web pages (cursor.com/docs/agent/tools/browser,
# retrieved 2026-10-03). The evidence triple
# (vendor-doc-url, snapshot-id, snapshot-date) lives at its canonical home,
# STANDARD-CONVENTION-PIN.md "Web-Fetch / Browser-Retrieval Surface", per
# rules/agent-capability-discipline-matrix.md §1A.
web_fetch: "yes"
tool_surface_restrictions:
  - secrets-paths
  - destructive-shell-ops
  - network-write-unsigned
system_prompt_template_path: "templates/apothem-rules.mdc"
agent_memory_surface: "n/a"

# Commands ship as skills in ~/.agents/skills/ with the shared skill emission, so the
# bytes are the same whichever adapter writes the folder: version, updated and
# portability fold under the standard `metadata` map, and the other source keys
# stay top-level. Cursor's docs list name and description; how it
# treats the keys it does not list is the open question recorded in
# STANDARD-CONVENTION-PIN.md.
conversion_losses:
  commands:
    name: "native:name"
    description: "native:description"
    argument-hint: "ignored"
    disable-model-invocation: "ignored"
    allowed-tools: "ignored"
    version: "native:metadata.version"
    updated: "native:metadata.updated"
    portability: "native:metadata.portability"

# Agents ship as Cursor subagents in <project>/.cursor/agents/<name>.md (see
# harnesses/_shared/install_driver_agent_copilot_cursor.py). Cursor documents
# name, description, model, readonly and is_background, and no tools key: a
# subagent inherits every tool of the parent. The one restriction Cursor can
# enforce is readonly: true (no file edits, no state-changing shell commands),
# so the source tools and disallowedTools reduce to that flag, written only for
# the five agents that are read-only and hold no Bash (the other nine inherit
# every Cursor tool). The seven read-only agents that keep Bash get no flag,
# since readonly would bar their test and lint runs, and their descriptions
# drop the read-only label that Cursor would not enforce. maxTurns has no
# Cursor key, no model is written, and version, updated and portability are
# Apothem metadata Cursor does not list.
  agents:
    name: "native:name"
    description: "native:description"
    tools: "native:readonly"
    disallowedTools: "native:readonly"
    maxTurns: "dropped"
    version: "dropped"
    updated: "dropped"
    portability: "dropped"
