<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="title desc">
  <title id="title">Apothem</title>
  <desc id="desc">A regular hexagon with six apothems radiating from its shared center to every edge midpoint; five are quiet slate and the apothem to the top edge is bold emerald — the namesake, and the picture of one shared profile reaching many destinations. A faint inscribed circle through the six edge midpoints traces the apothem distance itself, and an emerald node marks the shared center.</desc>
  <defs>
    <linearGradient id="apo-emerald" x1="110" y1="110" x2="110" y2="40.7" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="110" cy="110" r="69.3" stroke="#64748b" stroke-width="2.5" opacity="0.5"/>
    <polygon points="190,110 150,179.3 70,179.3 30,110 70,40.7 150,40.7" stroke="#334155" stroke-width="10"/>
    <g stroke="#94a3b8" stroke-width="4" opacity="0.7">
      <line x1="110" y1="110" x2="170" y2="75.35"/>
      <line x1="110" y1="110" x2="170" y2="144.65"/>
      <line x1="110" y1="110" x2="110" y2="179.3"/>
      <line x1="110" y1="110" x2="50" y2="144.65"/>
      <line x1="110" y1="110" x2="50" y2="75.35"/>
    </g>
    <line x1="110" y1="110" x2="110" y2="40.7" stroke="url(#apo-emerald)" stroke-width="9"/>
  </g>
  <g fill="#64748b" opacity="0.7">
    <circle cx="170" cy="75.35" r="4"/>
    <circle cx="170" cy="144.65" r="4"/>
    <circle cx="110" cy="179.3" r="4"/>
    <circle cx="50" cy="144.65" r="4"/>
    <circle cx="50" cy="75.35" r="4"/>
  </g>
  <circle cx="110" cy="110" r="8" fill="#334155"/>
  <circle cx="110" cy="110" r="3.5" fill="#059669"/>
  <circle cx="110" cy="40.7" r="7" fill="#059669"/>
</svg>
